<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico Profesional</title>
    
    <!-- LIBRERÍAS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.0/tokml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.7.5/dist/proj4.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.2.2/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #3498db; --accent-color: #e67e22; --panel-bg: rgba(255, 255, 255, 0.98); --shadow: 0 10px 25px rgba(0,0,0,0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; overflow: hidden; height: 100vh; }
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 5000; display: flex; justify-content: center; align-items: center; }
        .auth-form-box { background: white; padding: 40px; border-radius: 15px; box-shadow: var(--shadow); text-align: center; width: 350px; }
        .auth-form-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .auth-form-box button { width: 100%; padding: 12px; background: var(--secondary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        #visor-container { display: none; height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .custom-panel { z-index: 1000; background: var(--panel-bg); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.1); position: absolute; overflow: hidden; }
        #tools-panel { top: 20px; left: 20px; width: 340px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
        .panel-header { padding: 12px 18px; background: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; cursor: move; }
        .panel-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
        .panel-content { padding: 15px; overflow-y: auto; }
        .gis-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .gis-tool-btn { background: white; border: 1px solid #eee; padding: 10px 2px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 10px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .gis-tool-btn i { font-size: 15px; color: var(--secondary-color); }
        .gis-tool-btn:hover { background: #f0f7ff; transform: translateY(-2px); }
        .gis-tool-btn.active-tool { background: var(--secondary-color) !important; color: white !important; }
        .gis-tool-btn.active-tool i { color: white !important; }
        .main-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 5px; color: white; font-size: 12px; }
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 6000; display: flex; justify-content: center; align-items: center; }
        .layer-counter { font-size: 10px; background: #eee; padding: 2px 5px; border-radius: 10px; float: right; }
        .measurement-tooltip { background: white; border: 2px solid var(--secondary-color); padding: 5px; font-weight: bold; }
        
        /* Editor de Estilos */
        .style-editor { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; }
        .icon-opt { cursor: pointer; font-size: 18px; margin-right: 5px; padding: 5px; border: 1px solid transparent; }
        .icon-opt.selected { border-color: var(--secondary-color); background: #fff; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-form-box">
            <h2>ACCESO GIS</h2><br>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Usuario" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">INGRESAR</button>
            </form>
        </div>
    </div>

    <div id="visor-container">
        <div id="tools-panel" class="custom-panel">
            <div class="panel-header"><span class="panel-title">Herramientas GIS</span><span class="toggle-btn" style="cursor:pointer">−</span></div>
            <div class="panel-content">
                <input type="text" id="buscador" placeholder="Buscar en datos cargados...">
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <select id="layer-filter" style="width:50%"><option value="">Capas</option></select>
                    <select id="field-filter" style="width:50%"><option value="">Campos</option></select>
                </div>

                <button id="descargarSeleccion" class="main-btn" style="background:#27ae60">EXPORTAR KML</button>
                <button id="limpiarSeleccion" class="main-btn" style="background:#e67e22">LIMPIAR SELECCIÓN</button>

                <div class="gis-tools">
                    <div class="gis-tool-btn" id="info-parcela"><i class="fas fa-info-circle"></i>Catastro</div>
                    <div class="gis-tool-btn" id="measure-distance"><i class="fas fa-ruler"></i>Distancia</div>
                    <div class="gis-tool-btn" id="measure-area"><i class="fas fa-draw-polygon"></i>Área</div>
                    <div class="gis-tool-btn" id="mark-coords"><i class="fas fa-crosshairs"></i>Punto</div>
                    <div class="gis-tool-btn" id="create-buffer"><i class="fas fa-bullseye"></i>Buffer</div>
                    <div class="gis-tool-btn" id="select-by-relation"><i class="fas fa-project-diagram"></i>Relación</div>
                    <div class="gis-tool-btn" id="transform-coords"><i class="fas fa-sync"></i>Datum</div>
                    <div class="gis-tool-btn" id="print-map"><i class="fas fa-print"></i>Imprimir</div>
                    <div class="gis-tool-btn" id="cargar-capa-btn"><i class="fas fa-upload"></i>Subir</div>
                </div>

                <div class="style-editor">
                    <p style="font-size:11px; font-weight:bold; margin-bottom:5px;">EDITOR DE CAPA:</p>
                    <select id="layer-style-target"><option value="">Seleccione capa...</option></select>
                    <div id="point-options" style="margin-top:5px;">
                        <span class="icon-opt" data-icon="📍">📍</span>
                        <span class="icon-opt" data-icon="🏠">🏠</span>
                        <span class="icon-opt" data-icon="⚠️">⚠️</span>
                        <span class="icon-opt" data-icon="⭐">⭐</span>
                        <input type="color" id="style-color" value="#3498db" style="width:30px; height:25px; vertical-align:middle; border:none;">
                        <input type="number" id="style-weight" value="2" min="1" max="10" style="width:40px; padding:2px;">
                        <button id="apply-style" style="padding:2px 5px; font-size:10px;">Aplicar</button>
                    </div>
                </div>

                <div style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
                    <p style="font-size:10px; font-weight:bold;">COORDENADAS:</p>
                    <div style="display:flex; gap:2px">
                        <input type="text" id="search-lat" placeholder="Lat" style="margin:0">
                        <input type="text" id="search-lon" placeholder="Lon" style="margin:0">
                        <button id="search-coords-btn" style="background:var(--primary-color); color:white; border:none; padding:0 10px; border-radius:4px;"><i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>
                <button id="logout-button" style="width:100%; margin-top:10px; font-size:10px; background:none; border:none; color:#aaa; cursor:pointer;">Cerrar Sesión</button>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- MODAL RELACIÓN -->
    <div id="relation-selector-modal" class="modal-overlay hidden">
        <div class="custom-panel" style="width: 350px; background:white; position:relative">
            <div class="panel-header"><span>Relación Espacial</span><span class="close-modal" style="cursor:pointer">×</span></div>
            <div class="panel-content">
                <p style="font-size:11px">Objetivo:</p><select id="target-layer-select" style="width:100%"></select>
                <p style="font-size:11px">Referencia:</p><select id="reference-layer-select" style="width:100%"></select>
                <p style="font-size:11px">Tipo:</p>
                <select id="relation-type-select" style="width:100%">
                    <option value="intersects">Intersección</option>
                    <option value="contains">Dentro de</option>
                    <option value="near">Buffer (Próximo)</option>
                </select>
                <input type="number" id="distance-input" value="100" class="hidden" style="width:100%; margin-top:5px">
                <button id="apply-relation-btn" class="main-btn" style="background:var(--secondary-color); margin-top:10px">ANALIZAR</button>
                <div id="relation-results" style="font-size:11px; margin-top:10px; padding:5px; background:#f0f0f0;"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        
        const firebaseConfig = { apiKey: "AIzaSyDCe3gLAbQsn1kBh-nRnKu8dXelIs_GmhY", authDomain: "visor-geografico-presencia.firebaseapp.com", projectId: "visor-geografico-presencia" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const GITHUB_USER = 'DarioRocchi83';
        const GITHUB_REPO = 'visor-geografico';
        const POINT_COLORS = ['#e63946', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];

        let map, layersControl, allFeatures = [], mainLayerGroups = {}, seleccionActual = [], customIcons = {};

        onAuthStateChanged(auth, (user) => {
            if (user) { document.getElementById('auth-container').classList.add('hidden'); document.getElementById('visor-container').style.display = 'block'; initMap(); }
            else { document.getElementById('auth-container').classList.remove('hidden'); document.getElementById('visor-container').style.display = 'none'; }
        });

        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value)
            .catch(() => alert("Error de login"));
        };
        document.getElementById('logout-button').onclick = () => signOut(auth);

        function initMap() {
            if (map) return;
            map = L.map('map', { center: [-31.417, -64.183], zoom: 14 });
            
            const calles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
            const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
            const hibrido = L.layerGroup([
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'),
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png')
            ]).addTo(map);

            const catastro = L.tileLayer.wms('https://idecor-ws.mapascordoba.gob.ar/geoserver/idecor/wms', {
                layers: 'idecor:parcelas', format: 'image/png', transparent: true, attribution: 'IDECOR'
            });

            layersControl = L.control.layers({ "Calles": calles, "Satélite": satelite, "Híbrido": hibrido }, { "Parcelas": catastro }, { collapsed: false }).addTo(map);
            
            L.Control.geocoder({ defaultMarkGeocode: false, position: 'topleft' }).on('markgeocode', e => {
                map.setView(e.geocode.center, 17);
                L.marker(e.geocode.center).addTo(map).bindPopup(e.geocode.name).openPopup();
            }).addTo(map);

            map.pm.addControls({ position: 'topleft', drawMarker: false, drawPolygon: false, drawPolyline: false });
            loadDynamicLayers();
            setupGISFunctions();
        }

        async function loadDynamicLayers() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data`);
                const files = await response.json();
                let count = 0;
                for (const file of files) {
                    const layerName = file.name.split('.')[0];
                    if (file.name.endsWith('.geojson')) {
                        const data = await (await fetch(file.download_url)).json();
                        addGeoLayer(data, layerName, count++);
                    } else if (file.name.endsWith('.xlsx')) {
                        addExcelLayer(file.download_url, layerName, count++);
                    }
                }
            } catch (err) { console.error(err); }
        }

        function createIcon(color, char = '📍') {
            return L.divIcon({
                html: `<div style="background:${color}; width:12px; height:12px; border-radius:50%; border:2px solid white; display:flex; align-items:center; justify-content:center; font-size:8px;">${char}</div>`,
                className: 'custom-marker', iconSize: [12, 12]
            });
        }

        function addGeoLayer(data, name, idx) {
            const color = POINT_COLORS[idx % POINT_COLORS.length];
            const layer = L.geoJson(data, {
                style: { color: color, weight: 2, fillOpacity: 0.4 },
                pointToLayer: (f, ll) => L.marker(ll, { icon: createIcon(color) }),
                onEachFeature: (f, l) => bindFeature(f.properties, l, name, color)
            });
            register(layer, name);
        }

        async function addExcelLayer(url, name, idx) {
            const buffer = await (await fetch(url)).arrayBuffer();
            const data = XLSX.utils.sheet_to_json(XLSX.read(buffer).Sheets["Hoja1"]);
            const color = POINT_COLORS[idx % POINT_COLORS.length];
            const group = L.featureGroup();
            data.forEach(p => {
                if (p.Latitud && p.Longitud) {
                    const m = L.marker([p.Latitud, p.Longitud], { icon: createIcon(color) });
                    bindFeature(p, m, name, color);
                    group.addLayer(m);
                }
            });
            register(group, name);
        }

        function bindFeature(props, layer, layerName, color) {
            layer.featureData = { ...props, _layer: layerName };
            layer.originalStyle = { color: color, weight: 2 };
            let pop = `<b>${layerName}</b><hr>` + Object.entries(props).map(([k,v]) => `<b>${k}:</b> ${v}`).join('<br>');
            layer.bindPopup(pop);
            layer.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                toggleSelection(layer);
            });
            allFeatures.push(layer);
        }

        function toggleSelection(layer) {
            const i = seleccionActual.indexOf(layer);
            if (i > -1) {
                seleccionActual.splice(i, 1);
                if (layer.setStyle) layer.setStyle(layer.originalStyle);
                else layer.setOpacity(1);
            } else {
                seleccionActual.push(layer);
                if (layer.setStyle) layer.setStyle({ color: 'yellow', weight: 5 });
                else layer.setOpacity(0.5);
            }
            document.getElementById('selected-count').innerText = seleccionActual.length;
        }

        function register(layerGroup, name) {
            const count = layerGroup.getLayers ? layerGroup.getLayers().length : 0;
            layersControl.addOverlay(layerGroup, `${name} <span class="layer-counter">${count}</span>`);
            mainLayerGroups[name] = layerGroup;
            const opt = `<option value="${name}">${name}</option>`;
            document.getElementById('layer-filter').innerHTML += opt;
            document.getElementById('layer-style-target').innerHTML += opt;
            document.getElementById('target-layer-select').innerHTML += opt;
            document.getElementById('reference-layer-select').innerHTML += opt;
        }

        function setupGISFunctions() {
            // INFO PARCELA
            document.getElementById('info-parcela').onclick = function() {
                this.classList.toggle('active-tool');
                if (this.classList.contains('active-tool')) {
                    map.on('click', async (e) => {
                        const url = `https://idecor-ws.mapascordoba.gob.ar/geoserver/idecor/wms?service=WMS&version=1.1.1&request=GetFeatureInfo&layers=idecor:parcelas&query_layers=idecor:parcelas&info_format=application/json&bbox=${map.getBounds().toBBoxString()}&width=${map.getSize().x}&height=${map.getSize().y}&srs=EPSG:4326&x=${Math.round(e.containerPoint.x)}&y=${Math.round(e.containerPoint.y)}`;
                        const data = await (await fetch(url)).json();
                        if (data.features.length) {
                            let c = '<b>Parcela</b><br>';
                            for (let k in data.features[0].properties) c += `${k}: ${data.features[0].properties[k]}<br>`;
                            L.popup().setLatLng(e.latlng).setContent(c).openOn(map);
                        }
                    });
                } else map.off('click');
            };

            // MEDICIÓN ÁREA
            let areaPoints = [], areaPoly;
            document.getElementById('measure-area').onclick = function() {
                this.classList.toggle('active-tool');
                if (this.classList.contains('active-tool')) {
                    map.on('click', e => {
                        areaPoints.push(e.latlng);
                        if (areaPoly) map.removeLayer(areaPoly);
                        areaPoly = L.polygon(areaPoints, {color: 'red'}).addTo(map);
                    });
                    map.on('contextmenu', () => {
                        const a = L.GeometryUtil.geodesicArea(areaPoints);
                        L.popup().setLatLng(areaPoints[areaPoints.length-1]).setContent(`Área: ${(a/10000).toFixed(2)} Ha`).openOn(map);
                        areaPoints = [];
                    });
                } else { map.off('click'); map.off('contextmenu'); }
            };

            // DISTANCIA
            document.getElementById('measure-distance').onclick = () => map.pm.enableDraw('Line');
            map.on('pm:create', e => {
                if (e.shape === 'Line') {
                    let d = 0; const pts = e.layer.getLatLngs();
                    for(let i=1; i<pts.length; i++) d += pts[i-1].distanceTo(pts[i]);
                    e.layer.bindTooltip(`${d.toFixed(1)} m`, {permanent:true}).openTooltip();
                }
            });

            // BUFFER
            document.getElementById('create-buffer').onclick = () => {
                const r = prompt("Radio (m):", "100");
                map.once('click', e => {
                    const circle = L.circle(e.latlng, {radius: parseInt(r)}).addTo(map);
                    const b = circle.getBounds();
                    allFeatures.forEach(f => {
                        if (f.getLatLng && b.contains(f.getLatLng())) toggleSelection(f);
                    });
                });
            };

            // BUSCADOR INTERNO
            document.getElementById('buscador').oninput = e => {
                const val = e.target.value.toLowerCase();
                allFeatures.forEach(f => {
                    const txt = JSON.stringify(f.featureData).toLowerCase();
                    if (txt.includes(val)) f.addTo(map); else map.removeLayer(f);
                });
            };

            // RELACIÓN
            document.getElementById('select-by-relation').onclick = () => document.getElementById('relation-selector-modal').classList.remove('hidden');
            document.querySelector('.close-modal').onclick = () => document.getElementById('relation-selector-modal').classList.add('hidden');
            document.getElementById('apply-relation-btn').onclick = () => {
                const tName = document.getElementById('target-layer-select').value;
                const rName = document.getElementById('reference-layer-select').value;
                const target = mainLayerGroups[tName];
                const ref = mainLayerGroups[rName];
                let hits = 0;
                target.getLayers().forEach(tl => {
                    ref.getLayers().forEach(rl => {
                        if (tl.getBounds().intersects(rl.getBounds())) { toggleSelection(tl); hits++; }
                    });
                });
                document.getElementById('relation-results').innerText = `Hits: ${hits}`;
            };

            // ESTILOS
            document.getElementById('apply-style').onclick = () => {
                const name = document.getElementById('layer-style-target').value;
                const color = document.getElementById('style-color').value;
                const weight = document.getElementById('style-weight').value;
                const icon = customIcons[name] || '📍';
                mainLayerGroups[name].getLayers().forEach(l => {
                    if (l.setStyle) l.setStyle({ color: color, weight: weight });
                    if (l.setIcon) l.setIcon(createIcon(color, icon));
                    l.originalStyle = { color, weight };
                });
            };
            document.querySelectorAll('.icon-opt').forEach(opt => {
                opt.onclick = function() {
                    document.querySelectorAll('.icon-opt').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    customIcons[document.getElementById('layer-style-target').value] = this.dataset.icon;
                };
            });

            // LIMPIAR
            document.getElementById('limpiarSeleccion').onclick = () => {
                seleccionActual.forEach(l => {
                    if (l.setStyle) l.setStyle(l.originalStyle);
                    else l.setOpacity(1);
                });
                seleccionActual = [];
                document.getElementById('selected-count').innerText = "0";
            };

            // KML
            document.getElementById('descargarSeleccion').onclick = () => {
                if (!seleccionActual.length) return alert("Selecciona algo");
                const kml = tokml(L.featureGroup(seleccionActual).toGeoJSON());
                const blob = new Blob([kml], {type: 'text/xml'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "export.kml";
                link.click();
            };
        }

        // Draggable
        const panel = document.getElementById('tools-panel');
        const header = panel.querySelector('.panel-header');
        let drag = false, offset = [0,0];
        header.onmousedown = e => { drag = true; offset = [panel.offsetLeft - e.clientX, panel.offsetTop - e.clientY]; };
        document.onmousemove = e => { if(drag){ panel.style.left = (e.clientX + offset[0]) + 'px'; panel.style.top = (e.clientY + offset[1]) + 'px'; } };
        document.onmouseup = () => drag = false;
    </script>
</body>
</html>
