<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico Profesional</title>
    
    <!-- LIBRERÍAS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Geoman (Dibujo y Edición) -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <!-- BUSCADOR (Leaflet Geocoder) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    
    <!-- Utilidades GIS y Archivos -->
    <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.0/tokml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.7.5/dist/proj4.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.2.2/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- ESTILOS -->
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --dark-color: #1a252f;
            --light-color: #ecf0f1;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 20px rgba(0,0,0,0.15);
            --border-radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; overflow: hidden; height: 100vh; }
        
        /* Autenticación */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .auth-form-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 350px; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .auth-form-box h2 { margin-top: 0; color: #333; font-weight: 600; margin-bottom: 25px; }
        .auth-form-box input { width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; }
        .auth-form-box input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .auth-form-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
        .auth-form-box button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .auth-error { color: #e63946; margin-top: 10px; font-weight: 500; min-height: 20px; font-size: 14px; }
        .switch-form-link { color: #667eea; cursor: pointer; text-decoration: none; margin-top: 15px; display: inline-block; font-weight: 500; }
        
        /* Mapa y Contenedores */
        #visor-container { display: none; height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }
        #map.leaflet-crosshair { cursor: crosshair; }
        #map.leaflet-help { cursor: help; }
        .hidden { display: none !important; }
        
        /* Paneles Flotantes */
        .custom-panel { z-index: 1000; background: var(--panel-bg); border-radius: var(--border-radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); transition: all 0.3s ease; }
        #tools-panel { position: absolute; top: 20px; left: 20px; width: 350px; max-height: calc(100vh - 40px); overflow-y: auto; }
        #analysis-panel { position: absolute; top: 20px; right: 20px; width: 350px; max-height: 80vh; overflow-y: auto; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eee; background: linear-gradient(135deg, var(--primary-color), var(--dark-color)); color: white; border-radius: var(--border-radius) var(--border-radius) 0 0; cursor: move; user-select: none; }
        .panel-title { margin: 0; font-size: 1.1em; font-weight: 600; }
        .toggle-btn { cursor: pointer; font-size: 1.3em; padding: 0 8px; transition: transform 0.3s; }
        
        .panel-content { padding: 20px; }
        .custom-panel.collapsed .panel-content { display: none; }
        .custom-panel.collapsed .panel-header { border-bottom: none; border-radius: var(--border-radius); }
        
        .panel-content input, .panel-content select, .panel-content button { width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 12px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
        .panel-content button { background: linear-gradient(135deg, var(--secondary-color), #2980b9); color: white; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .panel-content button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .panel-content button.tool-btn { background: var(--light-color); color: var(--dark-color); border: 1px solid #ddd; }
        .panel-content button.tool-btn:hover { background: #e9ecef; border-color: #adb5bd; }
        
        #info-button { background: linear-gradient(135deg, #5a6878, #3e4a59); margin-top: 10px; }
        #info-button:hover { background: linear-gradient(135deg, #4a5568, #2d3748); }
        #logout-button { background: linear-gradient(135deg, var(--accent-color), #c0392b); margin-top: 5px; }
        
        /* Grilla de Herramientas - TAMAÑO ACHICADO */
        .gis-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 15px 0; }
        .gis-tool-btn { 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            color: #495057; 
            padding: 8px 2px; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: center; 
            transition: all 0.3s; 
            font-size: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        .gis-tool-btn i { font-size: 14px; margin-bottom: 3px; }
        .gis-tool-btn:hover { background: #e9ecef; border-color: #adb5bd; transform: translateY(-2px); }
        .gis-tool-btn.active-tool { background: var(--secondary-color) !important; color: white !important; border-color: var(--secondary-color) !important; }
        
        /* Secciones de Análisis */
        .analysis-section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .analysis-section h5 { margin-bottom: 12px; color: var(--primary-color); display: flex; align-items: center; gap: 8px; }
        .coordinate-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        
        /* Leaflet Custom Controls */
        .measurement-tooltip { background-color: rgba(255, 255, 255, 0.95); color: #2c3e50; border: 1px solid #3498db; padding: 8px 12px; font-weight: bold; border-radius: 4px; font-size: 13px; line-height: 1.4; text-align: left; box-shadow: 0 3px 8px rgba(0,0,0,0.3); pointer-events: none; }
        .element-counter { font-size: 13px; color: #666; text-align: center; margin: 10px 0; padding: 8px; background: #f8f9fa; border-radius: 6px; border: 1px solid #eee; }
        .layer-counter { font-size: 11px; color: #666; background: #f8f9fa; padding: 2px 6px; border-radius: 10px; margin-left: 8px; border: 1px solid #dee2e6; }
        .leaflet-control-north { background: white; padding: 5px; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.65); }
        .leaflet-control-north img { width: 32px; height: 40px; }
        .layer-load-error { color: #e74c3c; font-size: 12px; padding: 5px; margin-top: 5px; background: #f8d7da; border-radius: 4px; }
        
        /* Panel de Usuarios */
        #users-panel { position: absolute; bottom: 20px; right: 20px; width: 280px; max-height: 48px; overflow: hidden; transition: max-height 0.4s ease-in-out; }
        #users-panel:hover { max-height: 250px; }
        #users-panel .panel-header { padding: 12px 20px; }
        #users-panel .panel-content { padding: 10px 20px; }
        #users-panel .toggle-btn { display: none; }
        #users-list { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
        #users-list li { padding: 8px 0; font-size: 0.95em; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
        #users-list li:last-child { border-bottom: none; }
        #users-list li::before { content: '●'; color: #28a745; margin-right: 10px; font-size: 0.9em; }

        /* Editor de Iconos */
        .icon-editor { margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: #f8f9fa; }
        .icon-option { display: inline-block; width: 30px; height: 30px; margin: 5px; text-align: center; line-height: 30px; border: 2px solid transparent; border-radius: 50%; cursor: pointer; font-size: 14px; }
        .icon-option.selected { border-color: #3498db; background: #e3f2fd; }

        /* Estilos para relación */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: white; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--primary-color); font-size: 14px; }
        .form-select, .form-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: white; }
        .btn-primary { background: linear-gradient(135deg, var(--secondary-color), #2980b9); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-secondary { background: #6c757d; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-danger { background: linear-gradient(135deg, var(--accent-color), #c0392b); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .relation-selected { stroke: #ff00ff !important; stroke-width: 4 !important; fill-opacity: 0.7 !important; }
        .reference-highlight { stroke: #00ff00 !important; stroke-width: 3 !important; fill-opacity: 0.3 !important; }

        /* Ajuste para el geocodificador */
        .leaflet-control-geocoder { border-radius: 6px !important; box-shadow: var(--shadow) !important; }
    </style>
</head>
<body>
    <!-- Autenticación -->
    <div id="auth-container">
        <div class="auth-form-box">
            <form id="login-form">
                <h2><i class="fas fa-map-marked-alt"></i> Visor Geográfico</h2>
                <input type="email" id="login-email" placeholder="Correo electrónico" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
                <p id="login-error" class="auth-error"></p>
                <p class="switch-form-link" id="show-register">¿No tienes cuenta? <u>Regístrate aquí</u></p>
            </form>
            <form id="register-form" class="hidden">
                <h2><i class="fas fa-user-plus"></i> Crear Cuenta</h2>
                <input type="email" id="register-email" placeholder="Correo electrónico" required>
                <input type="password" id="register-password" placeholder="Contraseña (mín. 6 caracteres)" required>
                <button type="submit"><i class="fas fa-user-check"></i> Registrarse</button>
                <p id="register-error" class="auth-error"></p>
                <p class="switch-form-link" id="show-login">¿Ya tienes cuenta? <u>Ingresa aquí</u></p>
            </form>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div id="visor-container">
        <!-- Panel de Herramientas (Izquierda) -->
        <div id="tools-panel" class="custom-panel">
             <div class="panel-header"><h4 class="panel-title"><i class="fas fa-tools"></i> Herramientas GIS</h4><span class="toggle-btn">-</span></div>
            <div class="panel-content">
                <!-- Buscador Interno de Atributos -->
                <input type="text" id="buscador" placeholder="Filtrar por atributo...">
                <div style="display:flex; gap:5px; margin-bottom:15px">
                    <select id="layer-filter" style="margin-bottom:0"><option value="">Capas</option></select>
                    <select id="field-filter" style="margin-bottom:0"><option value="">Campos</option></select>
                </div>

                <div class="element-counter">
                    Seleccionados: <span id="selected-count">0</span> | 
                    Total: <span id="total-count">0</span>
                </div>
                <button id="descargarSeleccion"><i class="fas fa-download"></i> Descargar KML</button>
                <button id="limpiarSeleccion"><i class="fas fa-broom"></i> Limpiar Selección</button>
                
                <!-- Editor de Iconos -->
                <div class="icon-editor">
                    <select id="layer-icon-selector">
                        <option value="">Capa para icono</option>
                    </select>
                    <div id="icon-options" style="margin-top: 5px; display: flex; flex-wrap: wrap; justify-content: center;">
                        <div class="icon-option" data-icon="fa-home">🏠</div>
                        <div class="icon-option" data-icon="fa-tree">🌳</div>
                        <div class="icon-option" data-icon="fa-star">⭐</div>
                        <div class="icon-option" data-icon="fa-flag">🚩</div>
                    </div>
                    <button id="apply-icon-btn" style="margin-top: 5px; padding: 5px;"><i class="fas fa-check"></i> Aplicar Icono</button>
                </div>

                <!-- Botonera GIS - ACHICADA -->
                <div class="gis-tools">
                    <div class="gis-tool-btn" id="info-parcela"><i class="fas fa-info-circle"></i>Catastro</div>
                    <div class="gis-tool-btn" id="measure-distance"><i class="fas fa-ruler"></i>Distancia</div>
                    <div class="gis-tool-btn" id="measure-area"><i class="fas fa-draw-polygon"></i>Área</div>
                    <div class="gis-tool-btn" id="mark-coords"><i class="fas fa-map-marker-alt"></i>Coord</div>
                    <div class="gis-tool-btn" id="create-buffer"><i class="fas fa-bullseye"></i>Buffer</div>
                    <div class="gis-tool-btn" id="select-by-relation"><i class="fas fa-layer-group"></i>Relación</div>
                    <div class="gis-tool-btn" id="transform-coords"><i class="fas fa-exchange-alt"></i>Datum</div>
                    <div class="gis-tool-btn" id="print-map"><i class="fas fa-print"></i>Imprimir</div>
                    <div class="gis-tool-btn" id="cargar-capa-btn"><i class="fas fa-file-upload"></i>Subir</div>
                </div>
                <input type="file" id="layer-file-input" class="hidden" accept=".geojson,.kml,.kmz">

                <!-- Búsqueda de Coordenadas Lat/Lon -->
                <div class="analysis-section" style="margin-top: 15px; border-bottom: 0; padding-bottom: 0;">
                    <div class="coordinate-form">
                        <input type="text" id="search-lat" placeholder="Lat">
                        <input type="text" id="search-lon" placeholder="Lon">
                    </div>
                    <button id="search-coords-btn" style="margin-bottom: 0;"><i class="fas fa-crosshairs"></i> Ir</button>
                </div>

                <button id="logout-button"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            </div>
        </div>

        <!-- Panel Datum (Derecha) -->
        <div id="analysis-panel" class="custom-panel hidden">
            <div class="panel-header"><h4 class="panel-title"><i class="fas fa-exchange-alt"></i> Transformar</h4><span class="toggle-btn">-</span></div>
            <div class="panel-content">
                <div class="coordinate-form">
                    <input type="text" id="source-lat" placeholder="Lat" value="-31.41">
                    <input type="text" id="source-lng" placeholder="Lon" value="-64.18">
                </div>
                <select id="coord-system">
                    <option value="wgs84">WGS84</option>
                    <option value="gauss">POSGAR 07 (GK)</option>
                </select>
                <button id="transform-btn">Transformar</button>
                <div id="coord-result" style="margin-top: 10px; font-size: 12px; background: #eee; padding: 5px; border-radius: 5px;"></div>
            </div>
        </div>

        <!-- MODAL RELACIÓN -->
        <div id="relation-selector-modal" class="modal-overlay hidden">
            <div class="modal-content custom-panel" style="width: 400px;">
                <div class="panel-header"><h4 class="panel-title">Análisis Relación</h4><span class="close-modal" style="cursor: pointer;">&times;</span></div>
                <div class="panel-content">
                    <div class="form-group"><label>Capa Objetivo:</label><select id="target-layer-select" class="form-select"></select></div>
                    <div class="form-group"><label>Referencia:</label><select id="reference-layer-select" class="form-select"></select></div>
                    <div class="form-group"><label>Relación:</label><select id="relation-type-select" class="form-select"><option value="intersects">Interseca</option><option value="near">Cerca (Buffer)</option></select></div>
                    <button id="apply-relation-btn" class="btn-primary" style="width: 100%;">Analizar</button>
                </div>
            </div>
        </div>

        <div id="users-panel" class="custom-panel">
            <div class="panel-header"><h4 class="panel-title">Usuarios</h4></div>
            <div class="panel-content"><ul id="users-list"></ul></div>
        </div>

        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyDCe3gLAbQsn1kBh-nRnKu8dXelIs_GmhY", 
            authDomain: "visor-geografico-presencia.firebaseapp.com", 
            databaseURL: "https://visor-geografico-presencia-default-rtdb.firebaseio.com", 
            projectId: "visor-geografico-presencia"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);
        let mapInitialized = false;
        const GITHUB_USER = 'DarioRocchi83';
        const GITHUB_REPO = 'visor-geografico';
        const POINT_COLORS = ['#e63946', '#457b9d', '#2a9d8f', '#e9c46a', '#f4a261'];

        onAuthStateChanged(auth, (user) => { 
            if (user) { 
                document.getElementById('auth-container').classList.add('hidden'); 
                document.getElementById('visor-container').style.display = 'block'; 
                if (!mapInitialized) { inicializarMapa(); mapInitialized = true; } 
            } else { 
                document.getElementById('auth-container').classList.remove('hidden'); 
                document.getElementById('visor-container').style.display = 'none'; 
            } 
        });

        function inicializarMapa() {
            let allFeatures = [], layerFields = {}, mainLayerGroups = {}, seleccionActual = [], customIcons = {};
            
            const baseMaps = { 
                "Calles": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'), 
                "Satélite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'),
                "Híbrido": L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'), L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png')])
            };
            
            const map = L.map('map', { center: [-31.417, -64.183], zoom: 15, layers: [baseMaps.Calles] });
            const layersControl = L.control.layers(baseMaps, null, { position: 'topright', collapsed: false }).addTo(map);

            // --- 1. BUSCADOR DE DIRECCIONES Y CIUDADES ---
            L.Control.geocoder({
                defaultMarkGeocode: false,
                position: 'topleft',
                placeholder: 'Buscar dirección o ciudad...'
            })
            .on('markgeocode', function(e) {
                var bbox = e.geocode.bbox;
                var poly = L.polygon([
                    bbox.getSouthEast(),
                    bbox.getNorthEast(),
                    bbox.getNorthWest(),
                    bbox.getSouthWest()
                ]);
                map.fitBounds(poly.getBounds());
                L.marker(e.geocode.center).addTo(map).bindPopup(e.geocode.name).openPopup();
            })
            .addTo(map);

            map.pm.addControls({ position: 'topleft', drawMarker: false, drawPolygon: false, drawPolyline: false });

            // --- CARGA DE DATOS ---
            async function loadDynamicLayers() {
                try {
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data`);
                    const files = await response.json();
                    for (const [i, file] of files.entries()) {
                        const name = file.name.split('.')[0];
                        if (file.name.endsWith('.geojson')) {
                            const data = await (await fetch(file.download_url)).json();
                            const geoLayer = L.geoJson(data, {
                                style: { color: POINT_COLORS[i % 5] },
                                onEachFeature: (f, l) => {
                                    l.featureData = {...f.properties, _layerName: name};
                                    allFeatures.push(l);
                                    l.on('click', (e) => { L.DomEvent.stopPropagation(e); toggleSelect(l); });
                                }
                            }).addTo(map);
                            mainLayerGroups[name] = geoLayer;
                            layersControl.addOverlay(geoLayer, name);
                            document.getElementById('layer-filter').innerHTML += `<option value="${name}">${name}</option>`;
                            document.getElementById('layer-icon-selector').innerHTML += `<option value="${name}">${name}</option>`;
                            document.getElementById('target-layer-select').innerHTML += `<option value="${name}">${name}</option>`;
                            document.getElementById('reference-layer-select').innerHTML += `<option value="${name}">${name}</option>`;
                        }
                    }
                    document.getElementById('total-count').textContent = allFeatures.length;
                } catch (e) { console.error(e); }
            }

            function toggleSelect(layer) {
                const i = seleccionActual.indexOf(layer);
                if (i > -1) {
                    seleccionActual.splice(i, 1);
                    if (layer.setStyle) layer.setStyle({color: layer.options.color, weight: 2});
                } else {
                    seleccionActual.push(layer);
                    if (layer.setStyle) layer.setStyle({color: '#ffff00', weight: 5});
                }
                document.getElementById('selected-count').textContent = seleccionActual.length;
            }

            // --- HERRAMIENTAS ---
            document.getElementById('measure-distance').onclick = () => map.pm.enableDraw('Line');
            document.getElementById('measure-area').onclick = () => map.pm.enableDraw('Polygon');
            document.getElementById('limpiarSeleccion').onclick = () => { seleccionActual.forEach(l => l.setStyle({weight: 2})); seleccionActual = []; document.getElementById('selected-count').textContent = 0; };
            document.getElementById('transform-coords').onclick = () => document.getElementById('analysis-panel').classList.toggle('hidden');
            document.getElementById('select-by-relation').onclick = () => document.getElementById('relation-selector-modal').classList.remove('hidden');
            document.querySelector('.close-modal').onclick = () => document.getElementById('relation-selector-modal').classList.add('hidden');
            document.getElementById('logout-button').onclick = () => signOut(auth);

            loadDynamicLayers();
            makePanelDraggable(document.getElementById('tools-panel'));
        }

        document.getElementById('login-form').onsubmit = async (e) => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); } catch (e) { document.getElementById('login-error').textContent = "Error"; } };
        function makePanelDraggable(el) { const head = el.querySelector('.panel-header'); let drag = false, x, y; head.onmousedown = e => { drag = true; x = e.clientX - el.offsetLeft; y = e.clientY - el.offsetTop; }; document.onmousemove = e => { if (drag) { el.style.left = (e.clientX - x) + 'px'; el.style.top = (e.clientY - y) + 'px'; } }; document.onmouseup = () => drag = false; }
    </script>
</body>
</html>
