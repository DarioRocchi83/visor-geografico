<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico Profesional - Master</title>
    
    <!-- LIBRERÍAS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Geoman (Dibujo y Edición) -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    
    <!-- Utilidades GIS y Archivos -->
    <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.0/tokml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.7.5/dist/proj4.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.2.2/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- ESTILOS (De indexarrglar) -->
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --dark-color: #1a252f;
            --light-color: #ecf0f1;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 20px rgba(0,0,0,0.15);
            --border-radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; overflow: hidden; height: 100vh; }
        
        /* Autenticación */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .auth-form-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 350px; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .auth-form-box h2 { margin-top: 0; color: #333; font-weight: 600; margin-bottom: 25px; }
        .auth-form-box input { width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; }
        .auth-form-box input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .auth-form-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
        .auth-form-box button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .auth-error { color: #e63946; margin-top: 10px; font-weight: 500; min-height: 20px; font-size: 14px; }
        .switch-form-link { color: #667eea; cursor: pointer; text-decoration: none; margin-top: 15px; display: inline-block; font-weight: 500; }
        
        /* Mapa y Paneles */
        #visor-container { display: none; height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .custom-panel { z-index: 1000; position: absolute; background: var(--panel-bg); border-radius: var(--border-radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        #tools-panel { top: 20px; left: 20px; width: 350px; max-height: calc(100vh - 40px); overflow-y: auto; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eee; background: linear-gradient(135deg, var(--primary-color), var(--dark-color)); color: white; border-radius: var(--border-radius) var(--border-radius) 0 0; cursor: move; }
        .panel-content { padding: 20px; }
        .collapsed .panel-content { display: none; }

        /* Herramientas grid */
        .gis-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 6px; margin: 10px 0; }
        .gis-tool-btn { background: #f8f9fa; border: 1px solid #dee2e6; color: #495057; padding: 7px 3px; border-radius: 5px; cursor: pointer; text-align: center; transition: all 0.3s; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
        .gis-tool-btn:hover { background: #e9ecef; transform: translateY(-2px); }
        .active-tool { background: var(--secondary-color) !important; color: white !important; }

        /* Buscador de Direcciones */
        #geocoder-container { position: relative; margin-bottom: 15px; }
        #geocoder-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        #geocoder-results { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ddd; z-index: 2000; max-height: 200px; overflow-y: auto; display: none; }
        .geocoder-result-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 12px; }
        .geocoder-result-item:hover { background: #f0f0f0; }

        /* Usuarios Conectados */
        #users-panel { bottom: 20px; right: 20px; width: 250px; max-height: 40px; transition: max-height 0.3s; overflow: hidden; }
        #users-panel:hover { max-height: 300px; }
        #users-list { list-style: none; padding: 10px; font-size: 13px; }
        #users-list li::before { content: '●'; color: #28a745; margin-right: 8px; }

        .hidden { display: none !important; }
        .measurement-tooltip { background: white; border: 1px solid #3498db; padding: 5px; font-weight: bold; border-radius: 4px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 450px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- Autenticación (Configuración idéntica a Index Maestro) -->
    <div id="auth-container">
        <div class="auth-form-box">
            <form id="login-form">
                <h2><i class="fas fa-map-marked-alt"></i> Visor Geográfico</h2>
                <input type="email" id="login-email" placeholder="Correo electrónico" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
                <p id="login-error" class="auth-error"></p>
                <p class="switch-form-link" id="show-register">¿No tienes cuenta? <u>Regístrate aquí</u></p>
            </form>
            <form id="register-form" class="hidden">
                <h2><i class="fas fa-user-plus"></i> Crear Cuenta</h2>
                <input type="email" id="register-email" placeholder="Correo electrónico" required>
                <input type="password" id="register-password" placeholder="Contraseña (mín. 6 caracteres)" required>
                <button type="submit"><i class="fas fa-user-check"></i> Registrarse</button>
                <p id="register-error" class="auth-error"></p>
                <p class="switch-form-link" id="show-login">¿Ya tienes cuenta? <u>Ingresa aquí</u></p>
            </form>
        </div>
    </div>

    <!-- Visor -->
    <div id="visor-container">
        <div id="tools-panel" class="custom-panel">
            <div class="panel-header">
                <h4 class="panel-title"><i class="fas fa-tools"></i> Herramientas GIS</h4>
                <span class="toggle-btn" style="cursor:pointer">-</span>
            </div>
            <div class="panel-content">
                <!-- Buscador de Direcciones (Nuevo de Indexarrglar) -->
                <div id="geocoder-container">
                    <input type="text" id="geocoder-input" placeholder="🔍 Buscar ciudad o dirección...">
                    <div id="geocoder-results"></div>
                </div>

                <!-- Buscador de Capas -->
                <input type="text" id="buscador" placeholder="Buscar en datos cargados..." style="width:100%; padding:10px; margin-bottom:10px; border-radius:6px; border:1px solid #ddd;">
                
                <div style="font-size: 11px; margin-bottom: 10px; background: #eee; padding: 5px; border-radius: 4px;">
                    Seleccionados: <span id="selected-count">0</span> | Total: <span id="total-count">0</span>
                </div>

                <!-- Botonera GIS con estilo de indexarrglar -->
                <div class="gis-tools">
                    <div class="gis-tool-btn" id="info-parcela"><i class="fas fa-info-circle"></i>Info</div>
                    <div class="gis-tool-btn" id="measure-distance"><i class="fas fa-ruler"></i>Regla</div>
                    <div class="gis-tool-btn" id="measure-area"><i class="fas fa-draw-polygon"></i>Área</div>
                    <div class="gis-tool-btn" id="create-buffer"><i class="fas fa-bullseye"></i>Buffer</div>
                    <div class="gis-tool-btn" id="select-by-relation"><i class="fas fa-layer-group"></i>Relación</div>
                    <div class="gis-tool-btn" id="clear-drawings"><i class="fas fa-eraser"></i>Limpiar</div>
                    <div class="gis-tool-btn" id="print-map"><i class="fas fa-print"></i>JPG</div>
                    <div class="gis-tool-btn" id="cargar-capa-btn"><i class="fas fa-file-upload"></i>Subir</div>
                </div>

                <button id="descargarSeleccion" style="background:#2ecc71; color:white; width:100%; padding:10px; border:none; border-radius:6px; margin-top:10px; cursor:pointer;"><i class="fas fa-download"></i> Exportar KML</button>
                <button id="logout-button" style="background:#e74c3c; color:white; width:100%; padding:10px; border:none; border-radius:6px; margin-top:10px; cursor:pointer;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            </div>
        </div>

        <!-- Panel Usuarios Conectados -->
        <div id="users-panel" class="custom-panel">
            <div class="panel-header" style="padding:10px 20px"><h4 class="panel-title" style="font-size:14px">Conectados</h4></div>
            <ul id="users-list"></ul>
        </div>

        <div id="map"></div>
    </div>

    <!-- Modal de Selección por Relación -->
    <div id="relation-selector-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Selección Espacial</h3><br>
            <label>Capa Objetivo:</label>
            <select id="target-layer-select" style="width:100%; padding:8px; margin:10px 0;"></select>
            <label>Capa de Referencia:</label>
            <select id="reference-layer-select" style="width:100%; padding:8px; margin:10px 0;"></select>
            <label>Relación:</label>
            <select id="relation-type-select" style="width:100%; padding:8px; margin:10px 0;">
                <option value="intersects">Interseca con</option>
                <option value="contains">Contiene a</option>
                <option value="within">Está dentro de</option>
            </select>
            <br><br>
            <button id="apply-relation-btn" style="background:#3498db; color:white; padding:10px; width:100%; border:none; border-radius:5px; cursor:pointer">Aplicar</button>
            <button onclick="document.getElementById('relation-selector-modal').classList.add('hidden')" style="background:#95a5a6; color:white; padding:10px; width:100%; border:none; border-radius:5px; margin-top:5px; cursor:pointer">Cerrar</button>
        </div>
    </div>

    <script type="module">
        // --- CONFIGURACIÓN FIREBASE (Copiada de tu Index Maestro) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyDCe3gLAbQsn1kBh-nRnKu8dXelIs_GmhY", 
            authDomain: "visor-geografico-presencia.firebaseapp.com", 
            databaseURL: "https://visor-geografico-presencia-default-rtdb.firebaseio.com", 
            projectId: "visor-geografico-presencia", 
            storageBucket: "visor-geografico-presencia.appspot.com", 
            messagingSenderId: "761855239344", 
            appId: "1:761855239344:web:1d5b9ce48d5997bb90c775"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);

        let map, mapInitialized = false;
        const GITHUB_USER = 'DarioRocchi83';
        const GITHUB_REPO = 'visor-geografico';
        const POINT_COLORS = ['#e63946', '#457b9d', '#2a9d8f', '#e9c46a', '#f4a261'];

        // --- GESTIÓN DE USUARIOS Y CONEXIÓN ---
        onAuthStateChanged(auth, (user) => { 
            if (user) { 
                document.getElementById('auth-container').classList.add('hidden'); 
                document.getElementById('visor-container').style.display = 'block'; 
                if (!mapInitialized) { inicializarMapa(); mapInitialized = true; } 
                
                // Registro de presencia
                const userRef = ref(database, `connected_users/${user.uid}`); 
                set(userRef, { name: user.email, connected_at: serverTimestamp() }); 
                onDisconnect(userRef).remove(); 
            } else { 
                document.getElementById('auth-container').classList.remove('hidden'); 
                document.getElementById('visor-container').style.display = 'none'; 
            } 
        });

        // Escuchar usuarios conectados (Lógica del Maestro)
        onValue(ref(database, 'connected_users'), (snapshot) => { 
            const usersList = document.getElementById('users-list'); 
            usersList.innerHTML = ''; 
            const users = snapshot.val(); 
            if (users) { 
                Object.values(users).forEach(user => { 
                    const li = document.createElement('li'); 
                    li.textContent = user.name; 
                    usersList.appendChild(li); 
                }); 
            } 
        });

        // Eventos de login/registro
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value)
                .catch(err => document.getElementById('login-error').textContent = "Error de acceso.");
        });

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            createUserWithEmailAndPassword(auth, document.getElementById('register-email').value, document.getElementById('register-password').value)
                .catch(err => document.getElementById('register-error').textContent = err.message);
        });

        document.getElementById('logout-button').addEventListener('click', () => signOut(auth));
        document.getElementById('show-register').addEventListener('click', () => { document.getElementById('login-form').classList.add('hidden'); document.getElementById('register-form').classList.remove('hidden'); });
        document.getElementById('show-login').addEventListener('click', () => { document.getElementById('register-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden'); });

        // --- INICIALIZACIÓN DEL MAPA ---
        function inicializarMapa() {
            let allFeatures = [], mainLayerGroups = {}, seleccionActual = [];
            
            map = L.map('map', { center: [-31.417, -64.183], zoom: 14 });
            
            const base = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
            L.control.layers({"Calles": base, "Satélite": sat}).addTo(map);

            // Geoman y Herramientas
            map.pm.addControls({ position: 'topleft', drawMarker: false, drawPolygon: true, editMode: true, removalMode: true });
            map.pm.setLang('es');

            // --- CARGA DE DATOS DESDE GITHUB (Lógica Maestro) ---
            async function loadGithubLayers() {
                try {
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data`);
                    const files = await res.json();
                    
                    files.forEach(async (file, i) => {
                        if (file.name.endsWith('.geojson')) {
                            const dataRes = await fetch(file.download_url);
                            const data = await dataRes.json();
                            const layerName = file.name.replace('.geojson', '');
                            
                            const geoLayer = L.geoJson(data, {
                                style: { color: POINT_COLORS[i % 5], weight: 2 },
                                onEachFeature: (feature, layer) => {
                                    layer.bindPopup(`<b>Capa: ${layerName}</b><br>${JSON.stringify(feature.properties)}`);
                                    layer.on('click', (e) => {
                                        L.DomEvent.stopPropagation(e);
                                        if (seleccionActual.includes(layer)) {
                                            seleccionActual = seleccionActual.filter(l => l !== layer);
                                            layer.setStyle({ weight: 2, color: POINT_COLORS[i % 5] });
                                        } else {
                                            seleccionActual.push(layer);
                                            layer.setStyle({ weight: 5, color: '#ffff00' });
                                        }
                                        document.getElementById('selected-count').textContent = seleccionActual.length;
                                    });
                                    allFeatures.push(layer);
                                }
                            }).addTo(map);
                            mainLayerGroups[layerName] = geoLayer;
                            actualizarDropdowns(layerName);
                        }
                    });
                } catch (e) { console.error("Error cargando capas", e); }
            }

            function actualizarDropdowns(name) {
                const opt = `<option value="${name}">${name}</option>`;
                document.getElementById('target-layer-select').innerHTML += opt;
                document.getElementById('reference-layer-select').innerHTML += opt;
            }

            // --- BUSCADOR NOMINATIM (Nuevo) ---
            const geocoderInput = document.getElementById('geocoder-input');
            const geocoderResults = document.getElementById('geocoder-results');

            geocoderInput.addEventListener('input', async (e) => {
                const query = e.target.value;
                if (query.length < 3) return geocoderResults.style.display = 'none';
                
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=5`);
                const data = await res.json();
                
                geocoderResults.innerHTML = '';
                data.forEach(place => {
                    const div = document.createElement('div');
                    div.className = 'geocoder-result-item';
                    div.textContent = place.display_name;
                    div.onclick = () => {
                        map.setView([place.lat, place.lon], 16);
                        L.marker([place.lat, place.lon]).addTo(map).bindPopup(place.display_name).openPopup();
                        geocoderResults.style.display = 'none';
                    };
                    geocoderResults.appendChild(div);
                });
                geocoderResults.style.display = 'block';
            });

            // --- HERRAMIENTAS GIS ---
            document.getElementById('measure-area').onclick = () => {
                alert("Use la herramienta de Polígono en la izquierda para medir áreas.");
                map.pm.enableDraw('Polygon');
            };

            map.on('pm:create', (e) => {
                if (e.shape === 'Polygon') {
                    const area = L.GeometryUtil.geodesicArea(e.layer.getLatLngs()[0]);
                    e.layer.bindTooltip(`Área: ${(area/10000).toFixed(2)} ha`, {permanent: true}).openTooltip();
                }
            });

            document.getElementById('select-by-relation').onclick = () => {
                document.getElementById('relation-selector-modal').classList.remove('hidden');
            };

            document.getElementById('clear-drawings').onclick = () => {
                map.eachLayer(l => { if (l instanceof L.Path && !l.feature) map.removeLayer(l); });
                seleccionActual.forEach(l => l.setStyle({weight: 2}));
                seleccionActual = [];
                document.getElementById('selected-count').textContent = 0;
            };

            document.getElementById('print-map').onclick = () => {
                html2canvas(document.body).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'mapa.jpg';
                    link.href = canvas.toDataURL();
                    link.click();
                });
            };

            loadGithubLayers();
            
            // Drag panels
            const tools = document.getElementById('tools-panel');
            let isDragging = false;
            tools.querySelector('.panel-header').onmousedown = () => isDragging = true;
            window.onmousemove = (e) => {
                if (isDragging) {
                    tools.style.left = e.clientX - 175 + 'px';
                    tools.style.top = e.clientY - 20 + 'px';
                }
            };
            window.onmouseup = () => isDragging = false;
        }
    </script>
</body>
</html>
