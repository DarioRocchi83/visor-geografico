<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico Profesional - GIS Avanzado</title>
    
    <!-- LIBRERÍAS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Geoman (Dibujo y Edición) -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    
    <!-- Utilidades GIS y Archivos -->
    <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.0/tokml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.7.5/dist/proj4.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.2.2/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- ESTILOS -->
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --dark-color: #1a252f;
            --light-color: #ecf0f1;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 20px rgba(0,0,0,0.15);
            --border-radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; overflow: hidden; height: 100vh; }
        
        /* Autenticación */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .auth-form-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 350px; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .auth-form-box h2 { margin-top: 0; color: #333; font-weight: 600; margin-bottom: 25px; }
        .auth-form-box input { width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; }
        .auth-form-box input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .auth-form-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
        .auth-form-box button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .auth-error { color: #e63946; margin-top: 10px; font-weight: 500; min-height: 20px; font-size: 14px; }
        .switch-form-link { color: #667eea; cursor: pointer; text-decoration: none; margin-top: 15px; display: inline-block; font-weight: 500; }
        
        /* Mapa y Contenedores */
        #visor-container { display: none; height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }
        #map.leaflet-crosshair { cursor: crosshair; }
        .hidden { display: none !important; }
        
        /* Paneles Flotantes */
        .custom-panel { z-index: 1000; background: var(--panel-bg); border-radius: var(--border-radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); transition: all 0.3s ease; }
        #tools-panel { position: absolute; top: 20px; left: 20px; width: 350px; max-height: calc(100vh - 40px); overflow-y: auto; }
        #analysis-panel { position: absolute; top: 20px; right: 20px; width: 350px; max-height: 80vh; overflow-y: auto; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eee; background: linear-gradient(135deg, var(--primary-color), var(--dark-color)); color: white; border-radius: var(--border-radius) var(--border-radius) 0 0; cursor: move; user-select: none; }
        .panel-title { margin: 0; font-size: 1.1em; font-weight: 600; }
        .toggle-btn { cursor: pointer; font-size: 1.3em; padding: 0 8px; transition: transform 0.3s; }
        
        .panel-content { padding: 20px; }
        .custom-panel.collapsed .panel-content { display: none; }
        .custom-panel.collapsed .panel-header { border-bottom: none; border-radius: var(--border-radius); }
        
        .panel-content input, .panel-content select, .panel-content button { width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 12px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
        .panel-content button { background: linear-gradient(135deg, var(--secondary-color), #2980b9); color: white; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .panel-content button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        
        /* Grilla de Herramientas */
        .gis-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin: 15px 0; }
        .gis-tool-btn { background: #f8f9fa; border: 1px solid #dee2e6; color: #495057; padding: 12px 5px; border-radius: 6px; cursor: pointer; text-align: center; transition: all 0.3s; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .gis-tool-btn:hover { background: #e9ecef; border-color: #adb5bd; transform: translateY(-2px); }
        .active-tool { background: var(--secondary-color) !important; color: white !important; }
        
        .element-counter { font-size: 13px; color: #666; text-align: center; margin: 10px 0; padding: 8px; background: #f8f9fa; border-radius: 6px; border: 1px solid #eee; }
        .layer-counter { font-size: 11px; color: #666; background: #f8f9fa; padding: 2px 6px; border-radius: 10px; margin-left: 8px; border: 1px solid #dee2e6; }

        /* Modales */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        
        /* Animaciones de selección */
        .relation-selected { stroke: #ff00ff !important; stroke-width: 4 !important; fill-opacity: 0.7 !important; animation: pulse-select 1.5s infinite; }
        @keyframes pulse-select { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        .measurement-tooltip { background: white; padding: 5px; border: 1px solid #333; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Autenticación -->
    <div id="auth-container">
        <div class="auth-form-box">
            <form id="login-form">
                <h2><i class="fas fa-map-marked-alt"></i> Visor Geográfico</h2>
                <input type="email" id="login-email" placeholder="Correo electrónico" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
                <p id="login-error" class="auth-error"></p>
                <p class="switch-form-link" id="show-register">¿No tienes cuenta? Regístrate</p>
            </form>
            <form id="register-form" class="hidden">
                <h2>Crear Cuenta</h2>
                <input type="email" id="register-email" placeholder="Correo electrónico" required>
                <input type="password" id="register-password" placeholder="Contraseña" required>
                <button type="submit">Registrarse</button>
                <p class="switch-form-link" id="show-login">Volver al ingreso</p>
            </form>
        </div>
    </div>

    <!-- Visor -->
    <div id="visor-container">
        <div id="tools-panel" class="custom-panel">
            <div class="panel-header"><h4 class="panel-title">Herramientas GIS</h4><span class="toggle-btn">-</span></div>
            <div class="panel-content">
                <input type="text" id="buscador" placeholder="Buscar en capas...">
                <select id="layer-filter"><option value="">Todas las capas</option></select>
                <div class="element-counter">
                    Seleccionados: <span id="selected-count">0</span> | Total: <span id="total-count">0</span>
                </div>
                
                <div class="gis-tools">
                    <div class="gis-tool-btn" id="info-parcela"><i class="fas fa-info-circle"></i>Info Parcela</div>
                    <div class="gis-tool-btn" id="measure-distance"><i class="fas fa-ruler"></i>Distancia</div>
                    <div class="gis-tool-btn" id="measure-area"><i class="fas fa-draw-polygon"></i>Área</div>
                    <div class="gis-tool-btn" id="select-by-relation"><i class="fas fa-layer-group"></i>Relación</div>
                    <div class="gis-tool-btn" id="clear-drawings"><i class="fas fa-eraser"></i>Limpiar</div>
                    <div class="gis-tool-btn" id="print-map"><i class="fas fa-print"></i>Imprimir</div>
                </div>

                <button id="descargarSeleccion"><i class="fas fa-download"></i> Descargar KML</button>
                <button id="limpiarSeleccion" style="background: #95a5a6;"><i class="fas fa-broom"></i> Limpiar Selección</button>
                <button id="logout-button" style="background: var(--accent-color);"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </div>

        <!-- Modal de Relación -->
        <div id="relation-selector-modal" class="modal-overlay hidden">
            <div class="modal-content custom-panel" style="width: 450px;">
                <div class="panel-header"><h4 class="panel-title">Selección por Relación</h4><span class="close-modal" style="cursor:pointer">×</span></div>
                <div class="panel-content">
                    <label>Capa Objetivo:</label>
                    <select id="target-layer-select"></select>
                    <label>Capa Referencia:</label>
                    <select id="reference-layer-select"></select>
                    <label>Tipo:</label>
                    <select id="relation-type-select">
                        <option value="intersects">Intersección</option>
                        <option value="within">Dentro de</option>
                        <option value="near">Próximo a (m)</option>
                    </select>
                    <input type="number" id="distance-input" class="hidden" placeholder="Distancia en metros" value="100">
                    <button id="apply-relation-btn">Aplicar Selección</button>
                    <div id="relation-results" style="font-size: 12px; color: #2c3e50; margin-top: 10px;"></div>
                </div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        // Configuración Firebase (Usando la tuya)
        const firebaseConfig = { 
            apiKey: "AIzaSyDCe3gLAbQsn1kBh-nRnKu8dXelIs_GmhY", 
            authDomain: "visor-geografico-presencia.firebaseapp.com", 
            databaseURL: "https://visor-geografico-presencia-default-rtdb.firebaseio.com", 
            projectId: "visor-geografico-presencia", 
            storageBucket: "visor-geografico-presencia.appspot.com", 
            appId: "1:761855239344:web:1d5b9ce48d5997bb90c775"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Variables Globales
        let map, mainLayerGroups = {}, allFeatures = [], seleccionActual = [], relationHighlights = [];
        const GITHUB_USER = 'DarioRocchi83', GITHUB_REPO = 'visor-geografico';
        const COLORS = ['#e63946', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];

        // --- AUTH ---
        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('visor-container').style.display = 'block';
                if (!map) initMap();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('visor-container').style.display = 'none';
            }
        });

        document.getElementById('login-form').onsubmit = e => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value)
                .catch(err => document.getElementById('login-error').innerText = "Error de acceso");
        };

        document.getElementById('logout-button').onclick = () => signOut(auth);

        // --- MAPA ---
        function initMap() {
            map = L.map('map').setView([-31.41, -64.18], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            const wmsCatastro = L.tileLayer.wms('https://idecor-ws.mapascordoba.gob.ar/geoserver/idecor/wms', {
                layers: 'idecor:parcelas', format: 'image/png', transparent: true
            }).addTo(map);

            loadLayersFromGitHub();
        }

        async function loadLayersFromGitHub() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data`);
                const files = await res.json();
                
                files.forEach(async (file, i) => {
                    if (file.name.endsWith('.geojson')) {
                        const layerName = file.name.replace('.geojson', '');
                        const response = await fetch(file.download_url);
                        const data = await response.json();
                        
                        const group = L.geoJson(data, {
                            style: { color: COLORS[i % COLORS.length], weight: 2 },
                            pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, fillColor: COLORS[i % COLORS.length], fillOpacity: 0.8 }),
                            onEachFeature: (f, layer) => {
                                layer.originalStyle = { color: COLORS[i % COLORS.length], weight: 2, fillOpacity: 0.2 };
                                layer.originalIcon = (layer instanceof L.CircleMarker) ? layer.options : null;
                                layer.bindPopup(`<b>${layerName}</b><br>${JSON.stringify(f.properties)}`);
                                layer.on('click', e => {
                                    L.DomEvent.stopPropagation(e);
                                    toggleSelection(layer);
                                });
                                allFeatures.push(layer);
                            }
                        });
                        
                        mainLayerGroups[layerName] = group;
                        document.getElementById('layer-filter').innerHTML += `<option value="${layerName}">${layerName}</option>`;
                        document.getElementById('target-layer-select').innerHTML += `<option value="${layerName}">${layerName}</option>`;
                        document.getElementById('reference-layer-select').innerHTML += `<option value="${layerName}">${layerName}</option>`;
                        updateCounts();
                    }
                });
            } catch (e) { console.error("Error cargando capas", e); }
        }

        function toggleSelection(layer) {
            const idx = seleccionActual.indexOf(layer);
            if (idx > -1) {
                seleccionActual.splice(idx, 1);
                if (layer.setStyle) layer.setStyle(layer.originalStyle);
                if (layer instanceof L.CircleMarker) layer.setStyle({fillColor: layer.originalStyle.color});
            } else {
                seleccionActual.push(layer);
                if (layer.setStyle) layer.setStyle({ color: '#ffff00', weight: 5, fillOpacity: 0.7 });
                if (layer instanceof L.CircleMarker) layer.setStyle({fillColor: '#ffff00'});
            }
            document.getElementById('selected-count').innerText = seleccionActual.length;
        }

        function updateCounts() {
            let total = 0;
            Object.values(mainLayerGroups).forEach(g => total += g.getLayers().length);
            document.getElementById('total-count').innerText = total;
        }

        // --- HERRAMIENTAS GIS ---
        
        // Relación Espacial
        document.getElementById('select-by-relation').onclick = () => document.getElementById('relation-selector-modal').classList.remove('hidden');
        document.querySelector('.close-modal').onclick = () => {
            document.getElementById('relation-selector-modal').classList.add('hidden');
            clearHighlights();
        };

        document.getElementById('relation-type-select').onchange = e => {
            document.getElementById('distance-input').classList.toggle('hidden', e.target.value !== 'near');
        };

        document.getElementById('apply-relation-btn').onclick = () => {
            const targetName = document.getElementById('target-layer-select').value;
            const refName = document.getElementById('reference-layer-select').value;
            const type = document.getElementById('relation-type-select').value;
            const dist = parseFloat(document.getElementById('distance-input').value);

            const targetLayers = mainLayerGroups[targetName].getLayers();
            const refLayers = mainLayerGroups[refName].getLayers();

            // Activar capa objetivo si está apagada
            if (!map.hasLayer(mainLayerGroups[targetName])) mainLayerGroups[targetName].addTo(map);

            let matches = 0;
            targetLayers.forEach(t => {
                let found = false;
                for (let r of refLayers) {
                    if (checkRelation(t, r, type, dist)) { found = true; break; }
                }
                if (found && !seleccionActual.includes(t)) {
                    toggleSelection(t);
                    matches++;
                    // Añadir brillo temporal
                    const h = L.geoJson(t.toGeoJSON(), { style: { className: 'relation-selected' }}).addTo(map);
                    relationHighlights.push(h);
                }
            });

            document.getElementById('relation-results').innerHTML = `Se seleccionaron <b>${matches}</b> elementos nuevos.`;
            setTimeout(clearHighlights, 3000); // Limpiar pulsos después de 3 seg
        };

        function checkRelation(t, r, type, dist) {
            try {
                const bT = t.getBounds ? t.getBounds() : L.latLngBounds(t.getLatLng(), t.getLatLng());
                const bR = r.getBounds ? r.getBounds() : L.latLngBounds(r.getLatLng(), r.getLatLng());

                if (type === 'intersects') return bT.intersects(bR);
                if (type === 'within') return bR.contains(bT);
                if (type === 'near') return bT.getCenter().distanceTo(bR.getCenter()) <= dist;
            } catch (e) { return false; }
            return false;
        }

        function clearHighlights() {
            relationHighlights.forEach(h => map.removeLayer(h));
            relationHighlights = [];
        }

        // --- OTROS BOTONES ---
        document.getElementById('limpiarSeleccion').onclick = () => {
            seleccionActual.forEach(layer => {
                if (layer.setStyle) layer.setStyle(layer.originalStyle);
                if (layer instanceof L.CircleMarker) layer.setStyle({fillColor: layer.originalStyle.color});
            });
            seleccionActual = [];
            document.getElementById('selected-count').innerText = 0;
        };

        document.getElementById('descargarSeleccion').onclick = () => {
            if (seleccionActual.length === 0) return alert("Seleccione elementos");
            const collection = { type: "FeatureCollection", features: seleccionActual.map(l => l.toGeoJSON()) };
            const kml = tokml(collection);
            const blob = new Blob([kml], {type: "text/xml"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "seleccion_gis.kml"; a.click();
        };

        document.getElementById('buscador').oninput = e => {
            const val = e.target.value.toLowerCase();
            allFeatures.forEach(f => {
                const matches = JSON.stringify(f.feature.properties).toLowerCase().includes(val);
                if (val && !matches) { if(map.hasLayer(f)) map.removeLayer(f); }
                else { if(!map.hasLayer(f)) f.addTo(map); }
            });
        };

        // UI Helpers
        document.querySelectorAll('.toggle-btn').forEach(b => {
            b.onclick = () => b.closest('.custom-panel').classList.toggle('collapsed');
        });

    </script>
</body>
</html>
