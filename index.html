<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico Profesional</title>
    
    <!-- LIBRERÍAS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Geoman -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    
    <!-- Buscador de Direcciones (Geocoder) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <!-- Utilidades GIS -->
    <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.0/tokml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.7.5/dist/proj4.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.2.2/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e67e22;
            --dark-color: #1a252f;
            --panel-bg: rgba(255, 255, 255, 0.98);
            --shadow: 0 10px 25px rgba(0,0,0,0.2);
            --border-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; overflow: hidden; height: 100vh; }
        
        /* Autenticación */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 5000; display: flex; justify-content: center; align-items: center; }
        .auth-form-box { background: white; padding: 40px; border-radius: 15px; box-shadow: var(--shadow); text-align: center; width: 350px; }
        .auth-form-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .auth-form-box button { width: 100%; padding: 12px; background: var(--secondary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        
        /* Visor */
        #visor-container { display: none; height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }
        #map.leaflet-crosshair { cursor: crosshair; }

        /* Panel de Herramientas */
        .custom-panel { z-index: 1000; background: var(--panel-bg); border-radius: var(--border-radius); box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.1); position: absolute; overflow: hidden; }
        #tools-panel { top: 20px; left: 20px; width: 340px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
        
        .panel-header { padding: 12px 18px; background: var(--primary-color); color: white; display: flex; justify-content: space-between; align-items: center; cursor: move; }
        .panel-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        .panel-content { padding: 15px; overflow-y: auto; flex: 1; }
        
        /* Buscador Interno */
        .search-section { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        input[type="text"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 8px; font-size: 13px; }
        
        /* Grilla de Herramientas */
        .gis-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .gis-tool-btn { 
            background: white; border: 1px solid #eee; padding: 10px 2px; border-radius: 8px; cursor: pointer;
            text-align: center; transition: 0.2s; font-size: 10px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #444;
        }
        .gis-tool-btn i { font-size: 15px; color: var(--secondary-color); }
        .gis-tool-btn:hover { background: #f0f7ff; border-color: var(--secondary-color); transform: translateY(-2px); }
        .gis-tool-btn.active-tool { background: var(--secondary-color) !important; color: white !important; }
        .gis-tool-btn.active-tool i { color: white !important; }

        .main-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 5px; color: white; font-size: 12px; }

        /* Tooltip de mediciones */
        .measurement-tooltip { background: white; border: 2px solid var(--secondary-color); padding: 5px; border-radius: 5px; font-weight: bold; font-size: 12px; }
        
        .hidden { display: none !important; }
        .layer-counter { font-size: 10px; background: #eee; padding: 2px 5px; border-radius: 10px; margin-left: 5px; color: #666; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-form-box">
            <h2 style="margin-bottom:20px">VISOR GEOGRÁFICO</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Usuario / Email" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">ACCEDER AL SISTEMA</button>
                <p id="login-error" style="color:red; font-size:12px; margin-top:10px"></p>
            </form>
        </div>
    </div>

    <div id="visor-container">
        <div id="tools-panel" class="custom-panel">
            <div class="panel-header">
                <span class="panel-title"><i class="fas fa-toolbox"></i> Herramientas GIS</span>
                <span class="toggle-btn" style="cursor:pointer">−</span>
            </div>
            <div class="panel-content">
                <div class="search-section">
                    <input type="text" id="buscador" placeholder="Buscar en base de datos...">
                    <div style="display:flex; gap:5px">
                        <select id="layer-filter" style="flex:1"><option value="">Todas las capas</option></select>
                        <select id="field-filter" style="flex:1"><option value="">Campos</option></select>
                    </div>
                </div>

                <div style="font-size: 10px; color:#666; text-align:center; margin-bottom:10px;">
                    Elementos: <span id="total-count">0</span> | Seleccionados: <span id="selected-count">0</span>
                </div>

                <button id="descargarSeleccion" class="main-btn" style="background:#27ae60"><i class="fas fa-file-export"></i> EXPORTAR KML</button>
                <button id="limpiarSeleccion" class="main-btn" style="background:#e67e22"><i class="fas fa-eraser"></i> LIMPIAR SELECCIÓN</button>

                <div class="gis-tools">
                    <div class="gis-tool-btn" id="info-parcela"><i class="fas fa-info-circle"></i>Catastro</div>
                    <div class="gis-tool-btn" id="measure-distance"><i class="fas fa-ruler"></i>Distancia</div>
                    <div class="gis-tool-btn" id="measure-area"><i class="fas fa-draw-polygon"></i>Área</div>
                    <div class="gis-tool-btn" id="mark-coords"><i class="fas fa-crosshairs"></i>Punto</div>
                    <div class="gis-tool-btn" id="create-buffer"><i class="fas fa-bullseye"></i>Buffer</div>
                    <div class="gis-tool-btn" id="select-by-relation"><i class="fas fa-project-diagram"></i>Relación</div>
                    <div class="gis-tool-btn" id="transform-coords"><i class="fas fa-sync"></i>Datum</div>
                    <div class="gis-tool-btn" id="print-map"><i class="fas fa-print"></i>Imprimir</div>
                    <div class="gis-tool-btn" id="cargar-capa-btn"><i class="fas fa-upload"></i>Subir</div>
                </div>

                <div style="border-top: 1px solid #eee; padding-top:10px;">
                    <p style="font-size:10px; font-weight:bold; margin-bottom:5px">IR A COORDENADA:</p>
                    <div style="display:flex; gap:3px">
                        <input type="text" id="search-lat" placeholder="Lat" style="margin-bottom:0">
                        <input type="text" id="search-lon" placeholder="Lon" style="margin-bottom:0">
                        <button id="search-coords-btn" style="background:var(--primary-color); border:none; color:white; padding:0 10px; border-radius:5px; cursor:pointer"><i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>

                <button id="logout-button" style="width:100%; margin-top:15px; background:none; border:none; color:#999; cursor:pointer; font-size:11px;">Cerrar Sesión</button>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <!-- MODAL RELACIÓN ESPACIAL -->
    <div id="relation-selector-modal" class="modal-overlay hidden">
        <div class="custom-panel" style="width: 400px; background:white; position:relative">
            <div class="panel-header"><span>Análisis de Relación</span><span class="close-modal" style="cursor:pointer">×</span></div>
            <div class="panel-content">
                <p style="font-size:12px; margin-bottom:5px">Capa Objetivo:</p>
                <select id="target-layer-select"></select>
                <p style="font-size:12px; margin-bottom:5px">Capa de Referencia:</p>
                <select id="reference-layer-select"></select>
                <p style="font-size:12px; margin-bottom:5px">Tipo de Relación:</p>
                <select id="relation-type-select">
                    <option value="intersects">Intersección (Se tocan)</option>
                    <option value="contains">Contenido en</option>
                    <option value="near">Próximo a (Buffer)</option>
                </select>
                <div id="distance-control" class="hidden">
                    <input type="number" id="distance-input" value="100" placeholder="Metros">
                </div>
                <button id="apply-relation-btn" class="main-btn" style="background:var(--secondary-color); margin-top:10px">EJECUTAR ANÁLISIS</button>
                <div id="relation-results" style="font-size:11px; margin-top:10px; padding:10px; background:#f9f9f9; border-radius:5px;"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyDCe3gLAbQsn1kBh-nRnKu8dXelIs_GmhY", 
            authDomain: "visor-geografico-presencia.firebaseapp.com",
            projectId: "visor-geografico-presencia"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const GITHUB_USER = 'DarioRocchi83';
        const GITHUB_REPO = 'visor-geografico';
        const POINT_COLORS = ['#e63946', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];

        let map, layersControl, allFeatures = [], mainLayerGroups = {}, seleccionActual = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('visor-container').style.display = 'block';
                initMap();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('visor-container').style.display = 'none';
            }
        });

        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value)
                .catch(err => document.getElementById('login-error').innerText = "Error de acceso.");
        };

        document.getElementById('logout-button').onclick = () => signOut(auth);

        function initMap() {
            if (map) return;
            map = L.map('map', { center: [-31.417, -64.183], zoom: 14 });
            
            const calles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
            
            // BUSCADOR DE DIRECCIONES
            L.Control.geocoder({ defaultMarkGeocode: false, position: 'topleft', placeholder: 'Buscar calle/ciudad...' })
                .on('markgeocode', function(e) {
                    const center = e.geocode.center;
                    map.setView(center, 17);
                    L.marker(center).addTo(map).bindPopup(e.geocode.name).openPopup();
                }).addTo(map);

            const catastro = L.tileLayer.wms('https://idecor-ws.mapascordoba.gob.ar/geoserver/idecor/wms', {
                layers: 'idecor:parcelas', format: 'image/png', transparent: true, attribution: 'IDECOR'
            }).addTo(map);

            layersControl = L.control.layers({ "Calles": calles, "Satélite": satelite }, { "Parcelas": catastro }, { collapsed: false }).addTo(map);
            map.pm.addControls({ position: 'topleft', drawCircle: false, drawMarker: false, drawRectangle: false, drawPolygon: false, drawPolyline: false });

            loadDynamicLayers();
            setupTools();
        }

        async function loadDynamicLayers() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data`);
                const files = await response.json();
                let count = 0;
                for (const file of files) {
                    if (file.name.endsWith('.geojson')) {
                        const res = await fetch(file.download_url);
                        const data = await res.json();
                        addGeoJSONLayer(data, file.name.split('.')[0], count++);
                    } else if (file.name.endsWith('.xlsx')) {
                        addXLSXLayer(file.download_url, file.name.split('.')[0], count++);
                    }
                }
            } catch (err) { console.error("Error GitHub:", err); }
        }

        function addGeoJSONLayer(data, name, idx) {
            const color = POINT_COLORS[idx % POINT_COLORS.length];
            const layer = L.geoJson(data, {
                style: { color, weight: 2 },
                pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, fillColor: color, color: "#000", weight: 1, fillOpacity: 0.8 }),
                onEachFeature: (f, l) => setupFeature(f.properties, l, name)
            }).addTo(map);
            registerLayer(layer, name);
        }

        async function addXLSXLayer(url, name, idx) {
            const res = await fetch(url);
            const buffer = await res.arrayBuffer();
            const workbook = XLSX.read(buffer);
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(sheet);
            const group = L.featureGroup();
            const color = POINT_COLORS[idx % POINT_COLORS.length];
            
            data.forEach(p => {
                if (!p.Latitud || !p.Longitud) return;
                const marker = L.circleMarker([p.Latitud, p.Longitud], { radius: 6, fillColor: color, color: "#000", weight: 1, fillOpacity: 0.8 });
                setupFeature(p, marker, name);
                group.addLayer(marker);
            });
            group.addTo(map);
            registerLayer(group, name);
        }

        function setupFeature(props, layer, layerName) {
            layer.featureData = { ...props, _layer: layerName };
            let pop = `<b>${layerName}</b><hr>`;
            for (let k in props) pop += `<b>${k}:</b> ${props[k]}<br>`;
            layer.bindPopup(pop);
            
            layer.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                const i = seleccionActual.indexOf(layer);
                if (i > -1) {
                    seleccionActual.splice(i, 1);
                    if (layer.setStyle) layer.setStyle({ color: layer.originalColor || "#3388ff", weight: 2 });
                } else {
                    seleccionActual.push(layer);
                    layer.originalColor = layer.options.color;
                    if (layer.setStyle) layer.setStyle({ color: "yellow", weight: 4 });
                }
                document.getElementById('selected-count').innerText = seleccionActual.length;
            });
            allFeatures.push(layer);
        }

        function registerLayer(layerGroup, name) {
            const count = layerGroup.getLayers ? layerGroup.getLayers().length : 0;
            layersControl.addOverlay(layerGroup, `${name} <span class="layer-counter">${count}</span>`);
            mainLayerGroups[name] = layerGroup;
            document.getElementById('layer-filter').innerHTML += `<option value="${name}">${name}</option>`;
            document.getElementById('target-layer-select').innerHTML += `<option value="${name}">${name}</option>`;
            document.getElementById('reference-layer-select').innerHTML += `<option value="${name}">${name}</option>`;
            document.getElementById('total-count').innerText = allFeatures.length;
        }

        function setupTools() {
            // Buscador interno
            document.getElementById('buscador').oninput = (e) => {
                const val = e.target.value.toLowerCase();
                allFeatures.forEach(f => {
                    const match = Object.values(f.featureData).some(v => String(v).toLowerCase().includes(val));
                    if (match) { if(!map.hasLayer(f)) f.addTo(map); } else { map.removeLayer(f); }
                });
            };

            // Medición de Área Manual (Tu lógica original corregida)
            let areaPoints = [], areaPolygon;
            document.getElementById('measure-area').onclick = () => {
                alert("Clics en mapa para vértices. Doble clic para cerrar.");
                map.on('click', onMapClickArea);
                map.on('dblclick', onMapDblClickArea);
            };

            function onMapClickArea(e) {
                areaPoints.push(e.latlng);
                if (areaPolygon) map.removeLayer(areaPolygon);
                areaPolygon = L.polygon(areaPoints, {color: 'red'}).addTo(map);
            }

            function onMapDblClickArea() {
                const area = L.GeometryUtil.geodesicArea(areaPoints);
                alert("Área estimada: " + (area / 10000).toFixed(2) + " Ha");
                map.off('click', onMapClickArea);
                map.off('dblclick', onMapDblClickArea);
                areaPoints = [];
            }

            // Distancia (Geoman)
            document.getElementById('measure-distance').onclick = () => map.pm.enableDraw('Line');

            // Relación Espacial
            document.getElementById('select-by-relation').onclick = () => document.getElementById('relation-selector-modal').classList.remove('hidden');
            document.querySelector('.close-modal').onclick = () => document.getElementById('relation-selector-modal').classList.add('hidden');
            
            document.getElementById('apply-relation-btn').onclick = () => {
                const target = mainLayerGroups[document.getElementById('target-layer-select').value];
                const ref = mainLayerGroups[document.getElementById('reference-layer-select').value];
                const type = document.getElementById('relation-type-select').value;
                let found = 0;

                target.getLayers().forEach(tLayer => {
                    ref.getLayers().forEach(rLayer => {
                        let match = false;
                        if (type === 'intersects') match = tLayer.getBounds().intersects(rLayer.getBounds());
                        if (match && !seleccionActual.includes(tLayer)) {
                            seleccionActual.push(tLayer);
                            tLayer.setStyle({color: 'yellow', weight: 4});
                            found++;
                        }
                    });
                });
                document.getElementById('relation-results').innerText = `Encontrados: ${found} elementos.`;
                document.getElementById('selected-count').innerText = seleccionActual.length;
            };

            // Limpiar
            document.getElementById('limpiarSeleccion').onclick = () => {
                seleccionActual.forEach(l => { if(l.setStyle) l.setStyle({color: l.originalColor || "#3388ff", weight: 2}); });
                seleccionActual = [];
                document.getElementById('selected-count').innerText = "0";
            };

            // Exportar
            document.getElementById('descargarSeleccion').onclick = () => {
                if (!seleccionActual.length) return alert("Selecciona algo.");
                const kml = tokml(L.featureGroup(seleccionActual).toGeoJSON());
                const blob = new Blob([kml], {type: "text/xml"});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "seleccion.kml";
                link.click();
            };
        }

        // Draggable
        const panel = document.getElementById('tools-panel');
        const header = panel.querySelector('.panel-header');
        let isDragging = false, offset = [0,0];
        header.onmousedown = (e) => { isDragging = true; offset = [panel.offsetLeft - e.clientX, panel.offsetTop - e.clientY]; };
        document.onmousemove = (e) => { if(isDragging){ panel.style.left = (e.clientX + offset[0]) + 'px'; panel.style.top = (e.clientY + offset[1]) + 'px'; } };
        document.onmouseup = () => isDragging = false;
    </script>
</body>
</html>
