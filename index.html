<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor GIS Profesional</title>
    
    <!-- LIBRERÍAS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.0/tokml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.7.5/dist/proj4.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.2.2/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --border-radius: 8px;
            --shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; overflow: hidden; height: 100vh; }
        
        /* Autenticación (Compacta) */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; z-index: 3000; display: flex; justify-content: center; align-items: center; }
        .auth-form-box { background: white; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
        .auth-form-box input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .auth-form-box button { width: 100%; padding: 10px; background: var(--secondary-color); color: white; border: none; border-radius: 5px; cursor: pointer; }

        /* Mapa */
        #visor-container { display: none; height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }

        /* Paneles Flotantes (Diseño Delicado) */
        .custom-panel { 
            position: absolute; 
            z-index: 1000; 
            background: var(--panel-bg); 
            border-radius: var(--border-radius); 
            box-shadow: var(--shadow); 
            border: 1px solid rgba(0,0,0,0.1);
            width: 300px;
            overflow: hidden;
        }
        #tools-panel { top: 10px; left: 10px; max-height: 90vh; overflow-y: auto; }
        #relation-panel { top: 10px; left: 320px; width: 280px; display: none; } /* Panel de relación al lado del de herramientas */

        .panel-header { 
            background: var(--primary-color); 
            color: white; 
            padding: 8px 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: move;
            font-size: 0.9em;
        }
        .panel-content { padding: 12px; }
        .panel-content label { display: block; font-size: 0.8em; font-weight: bold; margin-bottom: 4px; color: #555; }
        .panel-content select, .panel-content input { width: 100%; padding: 6px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.85em; }
        .panel-content button { width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; transition: 0.2s; margin-bottom: 5px; }

        /* Botones específicos */
        .btn-apply { background: var(--secondary-color); color: white; }
        .btn-apply:hover { background: #2980b9; }
        .btn-clear { background: #95a5a6; color: white; }
        .btn-danger { background: var(--accent-color); color: white; }

        /* Grilla de Herramientas */
        .gis-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 10px 0; }
        .gis-tool-btn { 
            background: #fff; border: 1px solid #ddd; padding: 8px 2px; border-radius: 4px; 
            cursor: pointer; text-align: center; font-size: 0.7em; display: flex; flex-direction: column; align-items: center;
        }
        .gis-tool-btn i { font-size: 1.4em; margin-bottom: 3px; color: var(--primary-color); }
        .gis-tool-btn:hover { background: #f0f0f0; }
        .active-tool { background: var(--secondary-color) !important; color: white !important; }
        .active-tool i { color: white !important; }

        /* Contadores */
        .counter-box { background: #f8f9fa; padding: 8px; border-radius: 5px; border: 1px solid #eee; font-size: 0.8em; text-align: center; margin-bottom: 10px; }

        .hidden { display: none !important; }
        .collapsed .panel-content { display: none; }
    </style>
</head>
<body>

    <!-- Autenticación -->
    <div id="auth-container">
        <div class="auth-form-box">
            <h3 style="margin-bottom:15px">Visor Geográfico</h3>
            <input type="email" id="login-email" placeholder="Email" value="">
            <input type="password" id="login-password" placeholder="Contraseña" value="">
            <button id="login-btn">Ingresar</button>
            <p id="login-error" style="color:red; font-size:0.8em; margin-top:10px"></p>
        </div>
    </div>

    <div id="visor-container">
        <!-- Panel Principal -->
        <div id="tools-panel" class="custom-panel">
            <div class="panel-header">
                <span><i class="fas fa-toolbox"></i> Herramientas</span>
                <span class="toggle-btn" style="cursor:pointer">_</span>
            </div>
            <div class="panel-content">
                <input type="text" id="buscador" placeholder="Filtrar elementos...">
                <div class="counter-box">
                    Seleccionados: <b id="selected-count">0</b> | Total: <span id="total-count">0</span>
                </div>

                <div class="gis-tools">
                    <div class="gis-tool-btn" id="btn-info"><i class="fas fa-info-circle"></i>Info</div>
                    <div class="gis-tool-btn" id="btn-measure"><i class="fas fa-ruler-combined"></i>Medir</div>
                    <div class="gis-tool-btn" id="btn-relacion"><i class="fas fa-layer-group"></i>Relación</div>
                    <div class="gis-tool-btn" id="btn-print"><i class="fas fa-print"></i>Imagen</div>
                    <div class="gis-tool-btn" id="btn-clear-all"><i class="fas fa-eraser"></i>Dibujos</div>
                </div>

                <button class="btn-apply" id="btn-download"><i class="fas fa-download"></i> Descargar KML</button>
                <button class="btn-clear" id="btn-reset-sel"><i class="fas fa-broom"></i> Limpiar Selección</button>
                <button class="btn-danger" id="logout-btn-visor"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </div>

        <!-- Panel de Relación (FLOTANTE Y DELICADO) -->
        <div id="relation-panel" class="custom-panel">
            <div class="panel-header">
                <span><i class="fas fa- random"></i> Análisis Espacial</span>
                <span id="close-relation" style="cursor:pointer">×</span>
            </div>
            <div class="panel-content">
                <label>1. Capa a Seleccionar (Objetivo):</label>
                <select id="target-layer"></select>

                <label>2. Capa de Referencia:</label>
                <select id="ref-layer"></select>

                <label>3. Relación Espacial:</label>
                <select id="rel-type">
                    <option value="intersects">Intersección (Se tocan)</option>
                    <option value="within">Contenido en (Dentro de)</option>
                    <option value="near">Próximo a (Distancia)</option>
                </select>

                <div id="dist-box" class="hidden">
                    <label>Distancia (metros):</label>
                    <input type="number" id="rel-dist" value="100">
                </div>

                <button class="btn-apply" id="apply-spatial"><i class="fas fa-play"></i> Aplicar Selección</button>
                <div id="rel-status" style="font-size:0.75em; color:#666; text-align:center; margin-top:5px"></div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";

        // Configuración Firebase (Reemplaza con la tuya si es necesario)
        const firebaseConfig = { 
            apiKey: "AIzaSyDCe3gLAbQsn1kBh-nRnKu8dXelIs_GmhY", 
            authDomain: "visor-geografico-presencia.firebaseapp.com", 
            databaseURL: "https://visor-geografico-presencia-default-rtdb.firebaseio.com", 
            projectId: "visor-geografico-presencia", 
            storageBucket: "visor-geografico-presencia.appspot.com", 
            appId: "1:761855239344:web:1d5b9ce48d5997bb90c775"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let map, mainLayers = {}, allFeatures = [], seleccionActual = [];
        const GITHUB_URL = "https://api.github.com/repos/DarioRocchi83/visor-geografico/contents/data";

        // --- AUTH ---
        document.getElementById('login-btn').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value)
                .catch(err => document.getElementById('login-error').innerText = "Acceso denegado");
        };
        document.getElementById('logout-btn-visor').onclick = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('visor-container').style.display = 'block';
                if (!map) initGIS();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
            }
        });

        // --- INICIO GIS ---
        function initGIS() {
            map = L.map('map', { zoomControl: false }).setView([-31.41, -64.18], 12);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            
            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
            
            L.control.layers({"Calles": osm, "Satélite": sat}, {}, {position: 'topright'}).addTo(map);

            loadGitHubData();
            setupInteractions();
        }

        async function loadGitHubData() {
            try {
                const res = await fetch(GITHUB_URL);
                const files = await res.json();
                const targetSel = document.getElementById('target-layer');
                const refSel = document.getElementById('ref-layer');

                for (let file of files) {
                    if (file.name.endsWith('.geojson')) {
                        const name = file.name.replace('.geojson', '');
                        const dataRes = await fetch(file.download_url);
                        const data = await dataRes.json();

                        const layer = L.geoJson(data, {
                            style: (f) => ({ color: "#3498db", weight: 2, fillOpacity: 0.2 }),
                            pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, fillColor: "#3498db", fillOpacity: 0.8 }),
                            onEachFeature: (f, l) => {
                                l.originalStyle = { color: "#3498db", weight: 2, fillOpacity: 0.2, fillColor: "#3498db" };
                                l.bindPopup(`<b>Capa: ${name}</b><br>${JSON.stringify(f.properties)}`);
                                l.on('click', (e) => {
                                    L.DomEvent.stopPropagation(e);
                                    toggleFeatureSelection(l);
                                });
                                allFeatures.push(l);
                            }
                        });

                        mainLayers[name] = layer;
                        targetSel.innerHTML += `<option value="${name}">${name}</option>`;
                        refSel.innerHTML += `<option value="${name}">${name}</option>`;
                    }
                }
                updateTotalCount();
            } catch (e) { console.error(e); }
        }

        // --- LÓGICA DE SELECCIÓN ---
        function toggleFeatureSelection(layer, forceSelect = null) {
            const isSelected = seleccionActual.includes(layer);
            const shouldSelect = forceSelect !== null ? forceSelect : !isSelected;

            if (shouldSelect) {
                if (!seleccionActual.includes(layer)) seleccionActual.push(layer);
                if (layer.setStyle) layer.setStyle({ color: "#ffff00", weight: 4, fillOpacity: 0.6, fillColor: "#ffff00" });
            } else {
                const idx = seleccionActual.indexOf(layer);
                if (idx > -1) seleccionActual.splice(idx, 1);
                if (layer.setStyle) layer.setStyle(layer.originalStyle);
            }
            document.getElementById('selected-count').innerText = seleccionActual.length;
        }

        // --- SELECCIÓN POR RELACIÓN ---
        document.getElementById('btn-relacion').onclick = () => {
            document.getElementById('relation-panel').style.display = 'block';
        };

        document.getElementById('close-relation').onclick = () => {
            document.getElementById('relation-panel').style.display = 'none';
        };

        document.getElementById('rel-type').onchange = (e) => {
            document.getElementById('dist-box').classList.toggle('hidden', e.target.value !== 'near');
        };

        document.getElementById('apply-spatial').onclick = () => {
            const tName = document.getElementById('target-layer').value;
            const rName = document.getElementById('ref-layer').value;
            const type = document.getElementById('rel-type').value;
            const dist = parseFloat(document.getElementById('rel-dist').value);

            if (!tName || !rName) return alert("Seleccione capas");

            const tLayer = mainLayers[tName];
            const rLayer = mainLayers[rName];

            // Asegurar que las capas estén en el mapa para analizarlas
            if (!map.hasLayer(tLayer)) tLayer.addTo(map);
            if (!map.hasLayer(rLayer)) rLayer.addTo(map);

            let count = 0;
            const targets = tLayer.getLayers();
            const references = rLayer.getLayers();

            document.getElementById('rel-status').innerText = "Procesando...";

            targets.forEach(t => {
                let match = false;
                const tGeom = t.getBounds ? t.getBounds() : t.getLatLng();

                for (let r of references) {
                    const rGeom = r.getBounds ? r.getBounds() : r.getLatLng();

                    if (type === 'intersects') {
                        if (t.getBounds && r.getBounds) { if (t.getBounds().intersects(r.getBounds())) match = true; }
                        else if (t.getLatLng && r.getBounds) { if (r.getBounds().contains(t.getLatLng())) match = true; }
                        else if (t.getLatLng && r.getLatLng) { if (t.getLatLng().distanceTo(r.getLatLng()) < 5) match = true; }
                    } 
                    else if (type === 'within') {
                        if (r.getBounds && t.getBounds) { if (r.getBounds().contains(t.getBounds())) match = true; }
                        else if (r.getBounds && t.getLatLng) { if (r.getBounds().contains(t.getLatLng())) match = true; }
                    }
                    else if (type === 'near') {
                        const p1 = t.getBounds ? t.getBounds().getCenter() : t.getLatLng();
                        const p2 = r.getBounds ? r.getBounds().getCenter() : r.getLatLng();
                        if (p1.distanceTo(p2) <= dist) match = true;
                    }
                    if (match) break;
                }

                if (match) {
                    toggleFeatureSelection(t, true);
                    count++;
                }
            });

            document.getElementById('rel-status').innerHTML = `Listo. <b>${count}</b> elementos seleccionados.`;
        };

        // --- UTILIDADES ---
        document.getElementById('btn-reset-sel').onclick = () => {
            [...seleccionActual].forEach(l => toggleFeatureSelection(l, false));
            document.getElementById('rel-status').innerText = "";
        };

        document.getElementById('btn-clear-all').onclick = () => {
            map.eachLayer(l => { if(l.pm) map.removeLayer(l); });
            alert("Dibujos limpios");
        };

        function updateTotalCount() {
            let c = 0;
            Object.values(mainLayers).forEach(l => {
                l.addTo(map);
                c += l.getLayers().length;
            });
            document.getElementById('total-count').innerText = c;
        }

        function setupInteractions() {
            // Hacer paneles movibles
            makeDraggable(document.getElementById('tools-panel'));
            makeDraggable(document.getElementById('relation-panel'));

            document.querySelector('.toggle-btn').onclick = function() {
                this.closest('.custom-panel').classList.toggle('collapsed');
                this.innerText = this.closest('.custom-panel').classList.contains('collapsed') ? '+' : '_';
            };
        }

        function makeDraggable(el) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = el.querySelector('.panel-header');
            header.onmousedown = (e) => {
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                document.onmousemove = (e) => {
                    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                    pos3 = e.clientX; pos4 = e.clientY;
                    el.style.top = (el.offsetTop - pos2) + "px";
                    el.style.left = (el.offsetLeft - pos1) + "px";
                };
            };
        }

        document.getElementById('btn-download').onclick = () => {
            if (seleccionActual.length === 0) return alert("No hay nada seleccionado");
            const geojson = { type: "FeatureCollection", features: seleccionActual.map(l => l.toGeoJSON()) };
            const kml = tokml(geojson);
            const blob = new Blob([kml], {type: "text/xml"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "export_gis.kml"; a.click();
        };

        document.getElementById('btn-print').onclick = () => {
            html2canvas(document.body).then(canvas => {
                const link = document.createElement('a');
                link.download = 'captura_mapa.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        };

    </script>
</body>
</html>
