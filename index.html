<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico Pro | IDECOR & GIS</title>
    
    <!-- LIBRERÍAS BASE -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- GEOMAN (Dibujo) -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    
    <!-- BUSCADOR (Geocoder) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <!-- CLUSTERING (Agrupación de puntos para rendimiento) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <!-- UTILIDADES GIS -->
    <script src="https://cdn.jsdelivr.net/npm/tokml@0.4.0/tokml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.7.5/dist/proj4.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.2.2/dist/togeojson.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --dark-color: #1a252f;
            --light-color: #ecf0f1;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 20px rgba(0,0,0,0.15);
            --border-radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f8f9fa; overflow: hidden; height: 100vh; }
        
        /* Loader Overlay */
        #loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 3000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--secondary-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Autenticación */
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .auth-form-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 350px; }
        .auth-form-box input { width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #e1e5e9; border-radius: 8px; }
        .auth-form-box button { width: 100%; padding: 14px; background: var(--secondary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        
        /* Mapa */
        #visor-container { display: none; height: 100vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Paneles */
        .custom-panel { z-index: 1000; background: var(--panel-bg); border-radius: var(--border-radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); position: absolute; }
        #tools-panel { top: 20px; left: 20px; width: 350px; max-height: calc(100vh - 40px); overflow-y: auto; }
        .panel-header { padding: 15px 20px; background: linear-gradient(135deg, var(--primary-color), var(--dark-color)); color: white; border-radius: var(--border-radius) var(--border-radius) 0 0; display: flex; justify-content: space-between; cursor: move; }
        .panel-content { padding: 15px; }
        
        /* Estilos UI */
        .gis-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .gis-tool-btn { background: #fff; border: 1px solid #ddd; padding: 10px 5px; border-radius: 6px; cursor: pointer; text-align: center; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .gis-tool-btn:hover { background: #f0f0f0; }
        .active-tool { background: var(--secondary-color) !important; color: white !important; }
        
        .opacity-control { margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px; border: 1px solid #eee; }
        .opacity-control label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 5px; }
        
        .measurement-tooltip { background: white; border: 2px solid var(--secondary-color); padding: 5px; border-radius: 4px; font-weight: bold; }
        .hidden { display: none !important; }

        /* Ajuste del Buscador de Leaflet */
        .leaflet-control-geocoder { border-radius: 8px; box-shadow: var(--shadow) !important; border: none !important; }
        .leaflet-control-geocoder-form input { padding: 10px !important; }
    </style>
</head>
<body>

    <!-- Pantalla de Carga -->
    <div id="loader-overlay">
        <div class="spinner"></div>
        <p style="margin-top:15px; font-weight:600; color:var(--primary-color)">Cargando capas geográficas...</p>
    </div>

    <!-- Autenticación -->
    <div id="auth-container">
        <div class="auth-form-box">
            <form id="login-form">
                <h2><i class="fas fa-map-marked-alt"></i> Visor GIS Pro</h2>
                <br>
                <input type="email" id="login-email" placeholder="Correo electrónico" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">Ingresar al Sistema</button>
                <p id="login-error" style="color:red; margin-top:10px"></p>
            </form>
        </div>
    </div>

    <!-- Visor -->
    <div id="visor-container">
        <div id="tools-panel" class="custom-panel">
            <div class="panel-header">
                <h4 class="panel-title"><i class="fas fa-layer-group"></i> Herramientas</h4>
                <span class="toggle-btn" style="cursor:pointer">−</span>
            </div>
            <div class="panel-content">
                <!-- Buscador de Atributos -->
                <input type="text" id="buscador-atributos" placeholder="Filtrar en capas cargadas..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #ddd; margin-bottom:10px;">
                
                <div style="font-size:12px; color:#666; margin-bottom:15px; text-align:center;">
                    Elementos: <span id="selected-count">0</span> seleccionados
                </div>

                <!-- Botones de Acción -->
                <div style="display:flex; gap:5px; margin-bottom:15px;">
                    <button id="descargarKML" style="flex:1; padding:8px; background:#27ae60; color:white; border:none; border-radius:4px; cursor:pointer; font-size:11px;"><i class="fas fa-file-code"></i> KML</button>
                    <button id="descargarExcel" style="flex:1; padding:8px; background:#2980b9; color:white; border:none; border-radius:4px; cursor:pointer; font-size:11px;"><i class="fas fa-file-excel"></i> Excel</button>
                    <button id="limpiarSeleccion" style="flex:1; padding:8px; background:#e67e22; color:white; border:none; border-radius:4px; cursor:pointer; font-size:11px;"><i class="fas fa-eraser"></i> Limpiar</button>
                </div>

                <!-- Control de Opacidad -->
                <div class="opacity-control">
                    <label><i class="fas fa-adjust"></i> Opacidad de Capas Activas</label>
                    <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="0.8" style="width:100%">
                </div>

                <!-- Grilla GIS -->
                <div class="gis-tools">
                    <div class="gis-tool-btn" id="info-parcela"><i class="fas fa-info-circle"></i>Catastro</div>
                    <div class="gis-tool-btn" id="measure-dist"><i class="fas fa-ruler-horizontal"></i>Medir</div>
                    <div class="gis-tool-btn" id="measure-area"><i class="fas fa-draw-polygon"></i>Área</div>
                    <div class="gis-tool-btn" id="btn-buffer"><i class="fas fa-bullseye"></i>Buffer</div>
                    <div class="gis-tool-btn" id="btn-print"><i class="fas fa-print"></i>Imprimir</div>
                    <div class="gis-tool-btn" id="btn-streetview"><i class="fas fa-street-view"></i>Street</div>
                </div>

                <button id="logout-button" style="width:100%; padding:10px; background:#c0392b; color:white; border:none; border-radius:6px; cursor:pointer; margin-top:10px;">Cerrar Sesión</button>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        
        // CONFIGURACION FIREBASE (Reemplazar con la tuya)
        const firebaseConfig = { 
            apiKey: "AIzaSyDCe3gLAbQsn1kBh-nRnKu8dXelIs_GmhY", 
            authDomain: "visor-geografico-presencia.firebaseapp.com",
            projectId: "visor-geografico-presencia"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // CONFIGURACION GITHUB
        const GITHUB_USER = 'DarioRocchi83';
        const GITHUB_REPO = 'visor-geografico';

        let map, layersControl, clusterGroup;
        let allFeatures = [];
        let seleccionActual = [];
        let mainLayerGroups = {};

        // --- MANEJO DE SESIÓN ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('visor-container').style.display = 'block';
                if (!map) initMap();
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('visor-container').style.display = 'none';
            }
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value)
                .catch(err => document.getElementById('login-error').innerText = "Acceso denegado.");
        });

        document.getElementById('logout-button').addEventListener('click', () => signOut(auth));

        // --- INICIALIZACIÓN DEL MAPA ---
        function initMap() {
            map = L.map('map', { center: [-31.417, -64.183], zoom: 14 });

            // Mapas Base
            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' });
            const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' }).addTo(map);
            
            // IDECOR WMS
            const parcelas = L.tileLayer.wms('https://idecor-ws.mapascordoba.gob.ar/geoserver/idecor/wms', {
                layers: 'idecor:parcelas',
                format: 'image/png',
                transparent: true,
                attribution: 'IDECOR'
            }).addTo(map);

            layersControl = L.control.layers({ "Satélite": sat, "Calles": osm }, { "Parcelas (IDECOR)": parcelas }, { collapsed: false }).addTo(map);

            // --- 1. BUSCADOR DE LUGARES (GEOCODER) ---
            const geocoder = L.Control.geocoder({
                defaultMarkGeocode: false,
                placeholder: "Buscar dirección...",
                position: "topleft"
            })
            .on('markgeocode', function(e) {
                const center = e.geocode.center;
                map.setView(center, 17);
                L.marker(center).addTo(map).bindPopup(e.geocode.name).openPopup();
            })
            .addTo(map);

            // Clustering
            clusterGroup = L.markerClusterGroup({ disableClusteringAtZoom: 17 }).addTo(map);

            // Geoman
            map.pm.addControls({ position: 'topleft', drawCircle: false, drawMarker: false });

            loadDataFromGitHub();
            setupTools();
        }

        // --- 2. CARGA DE DATOS Y CLUSTERING ---
        async function loadDataFromGitHub() {
            document.getElementById('loader-overlay').style.display = 'flex';
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data`);
                const files = await response.json();
                
                for (const file of files) {
                    if (file.name.endsWith('.geojson')) {
                        const res = await fetch(file.download_url);
                        const data = await res.json();
                        processGeoJSON(data, file.name);
                    }
                }
            } catch (error) {
                console.error("Error cargando capas:", error);
            } finally {
                document.getElementById('loader-overlay').style.display = 'none';
            }
        }

        function processGeoJSON(data, name) {
            const layerName = name.replace('.geojson', '');
            const geoLayer = L.geoJson(data, {
                onEachFeature: (feature, layer) => {
                    allFeatures.push(layer);
                    layer.bindPopup(`<b>Capa: ${layerName}</b><br>${Object.entries(feature.properties).map(([k,v]) => `<b>${k}:</b> ${v}`).join('<br>')}`);
                    
                    layer.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        toggleSelection(layer);
                    });
                },
                pointToLayer: (feature, latlng) => L.marker(latlng)
            });

            clusterGroup.addLayer(geoLayer);
            layersControl.addOverlay(geoLayer, layerName);
            mainLayerGroups[layerName] = geoLayer;
        }

        function toggleSelection(layer) {
            const idx = seleccionActual.indexOf(layer);
            if (idx > -1) {
                seleccionActual.splice(idx, 1);
                if (layer.setStyle) layer.setStyle({ color: '#3388ff', weight: 3 });
            } else {
                seleccionActual.push(layer);
                if (layer.setStyle) layer.setStyle({ color: 'yellow', weight: 5 });
            }
            document.getElementById('selected-count').innerText = seleccionActual.length;
        }

        // --- 3. MEJORAS ADICIONALES ---

        function setupTools() {
            // Opacidad
            document.getElementById('opacity-slider').addEventListener('input', (e) => {
                const val = e.target.value;
                Object.values(mainLayerGroups).forEach(l => {
                    if (l.setOpacity) l.setOpacity(val);
                    if (l.setStyle) l.setStyle({ fillOpacity: val, opacity: val });
                });
            });

            // Street View
            document.getElementById('btn-streetview').addEventListener('click', () => {
                alert("Haz clic en el mapa para ver la calle.");
                map.once('click', (e) => {
                    const url = `https://www.google.com/maps?q=&layer=c&cbll=${e.latlng.lat},${e.latlng.lng}`;
                    window.open(url, '_blank');
                });
            });

            // Exportar Excel
            document.getElementById('descargarExcel').addEventListener('click', () => {
                if (seleccionActual.length === 0) return alert("No hay elementos seleccionados.");
                const data = seleccionActual.map(l => l.feature.properties);
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Seleccion");
                XLSX.writeFile(wb, "exportacion_gis.xlsx");
            });

            // Medición
            document.getElementById('measure-dist').addEventListener('click', () => {
                map.pm.enableDraw('Line', { finishOn: 'dblclick' });
            });

            // Limpiar
            document.getElementById('limpiarSeleccion').addEventListener('click', () => {
                seleccionActual.forEach(l => { if (l.setStyle) l.setStyle({ color: '#3388ff', weight: 3 }); });
                seleccionActual = [];
                document.getElementById('selected-count').innerText = "0";
            });

            // Imprimir
            document.getElementById('btn-print').addEventListener('click', () => {
                window.print();
            });
        }

        // Draggable panel
        const panel = document.getElementById('tools-panel');
        const header = panel.querySelector('.panel-header');
        let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        header.addEventListener("mousedown", dragStart);
        document.addEventListener("mousemove", drag);
        document.addEventListener("mouseup", dragEnd);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            if (e.target === header || header.contains(e.target)) active = true;
        }
        function drag(e) {
            if (active) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                panel.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }
        function dragEnd() { active = false; }

    </script>
</body>
</html>
